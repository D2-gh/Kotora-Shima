<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ことばクエスト</title>
<style>
  @font-face {
    font-family: 'PixelJP';
    src: local('sans-serif');
  }

  :root {
    --sky-top: #6ec6ff;
    --sky-bottom: #bfe8ff;
    --grass: #7cbb3f;
    --grass-dark: #5a9430;
    --dirt: #9c6b3e;
    --dirt-dark: #7a5230;
    --stone: #8a8a8a;
    --wood: #b1793f;
    --wood-dark: #8a5c2c;
    --gold: #ffd23f;
    --gold-dark: #d9a300;
    --panel: #4a3423;
    --panel-light: #6b4d31;
    --white: #fff8e7;
    --ok: #6bcf4f;
    --bad: #e85d4a;
    --text-dark: #2b1d10;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    touch-action: manipulation;
    user-select: none;
  }

  body {
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%);
    position: relative;
  }

  /* pixel cloud decorations */
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 4px;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.85);
    opacity: 0.9;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    overflow: hidden;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 16px) + 12px);
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  /* ---------- HOME ---------- */
  #home {
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
  }

  .title-block {
    margin-top: 18px;
    text-align: center;
  }

  /* ---------- PARENT SETTINGS ---------- */
  .parent-settings-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: none;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.65;
    z-index: 5;
  }
  .parent-settings-btn:active { transform: scale(0.92); }

  #parentSettings { background: var(--white); }
  .parent-title {
    flex: 1;
    text-align: center;
    font-size: 16px;
    font-weight: 900;
    color: var(--panel);
  }
  .parent-count {
    background: var(--gold);
    border: 2px solid var(--gold-dark);
    border-radius: 10px;
    padding: 5px 9px;
    font-weight: 800;
    font-size: 12px;
    color: var(--text-dark);
    flex-shrink: 0;
  }
  .parent-sub {
    text-align: center;
    font-size: 12px;
    color: var(--panel-light);
    font-weight: 700;
    margin: 2px 0 10px;
  }
  .word-list-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    overflow-y: auto;
    padding-bottom: 20px;
  }
  .word-card {
    background: rgba(255,255,255,0.7);
    border: 3px solid var(--panel-light);
    border-radius: 12px;
    padding: 8px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .word-card .thumb {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .word-card .thumb svg,
  .word-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .word-card .wlabel {
    font-size: 12px;
    font-weight: 800;
    color: var(--panel);
    text-align: center;
    line-height: 1.2;
  }
  .word-card .wcat {
    font-size: 9px;
    color: var(--panel-light);
    font-weight: 700;
  }

  .title-block h1 {
    font-size: 32px;
    color: var(--panel);
    text-shadow: 3px 3px 0 var(--white), -1px -1px 0 var(--white), 1px -1px 0 var(--white), -1px 1px 0 var(--white);
    margin: 0;
    letter-spacing: 2px;
    font-weight: 900;
  }
  .title-block p {
    margin: 4px 0 0;
    color: var(--panel-light);
    font-weight: 700;
    font-size: 14px;
  }

  .avatar-row {
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(255,255,255,0.55);
    padding: 8px 14px;
    border-radius: 14px;
  }
  .gem {
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 800;
    color: var(--panel);
    font-size: 15px;
  }
  .gem .icon { font-size: 18px; }

  .mode-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    width: 100%;
    max-width: 420px;
    margin-top: 6px;
  }

  .mode-card {
    position: relative;
    border-radius: 16px;
    padding: 16px 16px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: none;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 8px 14px rgba(0,0,0,0.15);
    transform: translateY(0);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    color: var(--white);
  }
  .mode-card:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  .mode-card.blocks { background: linear-gradient(160deg, #8bc94f, var(--grass-dark)); }
  .mode-card.match { background: linear-gradient(160deg, #4fb3d9, #2d7fa3); }
  .mode-card.journey { background: linear-gradient(160deg, #e2a13f, #b9761f); }

  .mode-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.25);
  }
  .mode-text h3 {
    margin: 0 0 3px;
    font-size: 19px;
    font-weight: 900;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
  }
  .mode-text p {
    margin: 0;
    font-size: 12.5px;
    opacity: 0.95;
    line-height: 1.4;
  }

  .category-strip {
    width: 100%;
    max-width: 420px;
    margin-top: 8px;
  }
  .category-strip h4 {
    color: var(--panel);
    font-size: 13px;
    margin: 0 0 8px 2px;
    font-weight: 800;
  }
  .cat-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .cat-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    border: 3px solid var(--panel);
    background: var(--white);
    color: var(--panel);
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .cat-chip.active {
    background: var(--gold);
    border-color: var(--gold-dark);
  }

  /* ---------- HEADER (in-game) ---------- */
  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--panel);
    color: var(--white);
    border: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 #2b1d10aa;
  }
  .back-btn:active { transform: translateY(3px); box-shadow: none; }

  .progress-track {
    flex: 1;
    height: 16px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    margin: 0 10px;
    overflow: hidden;
    border: 2px solid var(--panel);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ok), #8fe66f);
    width: 0%;
    transition: width 0.4s ease;
  }

  .score-badge {
    background: var(--gold);
    border: 2px solid var(--gold-dark);
    border-radius: 10px;
    padding: 6px 10px;
    font-weight: 900;
    color: var(--text-dark);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  /* ---------- BLOCKS GAME ---------- */
  #blocksGame { align-items: center; justify-content: flex-start; gap: 16px; }

  .prompt-visual {
    width: 110px;
    height: 110px;
    margin: 4px auto 0;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.15));
  }
  .prompt-visual svg {
    width: 100%;
    height: 100%;
    border-radius: 14px;
  }

  .target-slots {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 64px;
  }
  .slot {
    width: 54px;
    height: 60px;
    border-radius: 8px;
    background: rgba(255,255,255,0.4);
    border: 3px dashed var(--panel-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 900;
    color: var(--panel);
  }
  .slot.filled {
    background: var(--white);
    border: 3px solid var(--wood-dark);
    box-shadow: 0 3px 0 var(--wood-dark);
  }

  .block-tray {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 4px;
  }
  .letter-block {
    width: 58px;
    height: 58px;
    border-radius: 8px;
    background: linear-gradient(160deg, var(--wood), var(--wood-dark));
    border: none;
    box-shadow: 0 5px 0 #5c3d1c, inset 0 0 0 3px rgba(255,255,255,0.15);
    color: var(--white);
    font-size: 26px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .letter-block:active { transform: translateY(4px); box-shadow: 0 1px 0 #5c3d1c; }
  .letter-block.used { visibility: hidden; }

  .check-btn, .next-btn, .primary-btn {
    background: linear-gradient(160deg, var(--gold), var(--gold-dark));
    border: none;
    border-radius: 12px;
    padding: 14px 30px;
    font-size: 17px;
    font-weight: 900;
    color: var(--text-dark);
    box-shadow: 0 5px 0 #a67c00;
    cursor: pointer;
    margin-top: 8px;
  }
  .check-btn:active, .next-btn:active, .primary-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #a67c00; }
  .check-btn:disabled { opacity: 0.4; }

  .feedback-banner {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    padding: 10px 18px;
    border-radius: 12px;
    margin-top: 4px;
    display: none;
  }
  .feedback-banner.show { display: block; }
  .feedback-banner.ok { background: #d7f3c8; color: #2f6b1a; }
  .feedback-banner.bad { background: #fbdad4; color: #a33322; }

  /* ---------- MATCH GAME ---------- */
  #matchGame { align-items: center; justify-content: flex-start; gap: 14px; }

  .word-flash-stage {
    width: 100%;
    max-width: 380px;
    height: 110px;
    background: var(--panel);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 4px var(--panel-light), 0 6px 0 #2b1d10aa;
    margin-top: 6px;
  }
  .word-flash-text {
    font-size: 46px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 2px;
  }

  .match-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 380px;
    margin-top: 6px;
  }
  .match-card {
    background: var(--white);
    border: 4px solid var(--panel-light);
    border-radius: 14px;
    padding: 14px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 5px 0 #b89b7a;
  }
  .match-card:active { transform: translateY(4px); box-shadow: 0 1px 0 #b89b7a; }
  .match-card .emoji { width: 64px; height: 64px; }
  .match-card .emoji svg { width: 100%; height: 100%; }
  .match-card .label { font-size: 15px; font-weight: 800; color: var(--panel); }
  .match-card.correct-flash { background: #d7f3c8; border-color: var(--ok); }
  .match-card.wrong-flash { background: #fbdad4; border-color: var(--bad); }

  /* ---------- JOURNEY GAME ---------- */
  #journeyGame { align-items: center; justify-content: flex-start; gap: 14px; }

  .journey-map {
    width: 100%;
    max-width: 400px;
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 4px 0 8px;
  }
  .map-step {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: 2px solid var(--panel-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .map-step.done { background: var(--ok); border-color: #4a9636; }
  .map-step.current { background: var(--gold); border-color: var(--gold-dark); transform: scale(1.15); }

  .sentence-card {
    background: var(--white);
    border-radius: 18px;
    padding: 26px 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 6px 0 #b89b7a;
    text-align: center;
    margin-top: 4px;
  }
  .sentence-emoji { width: 84px; height: 84px; margin: 0 auto 10px; }
  .sentence-emoji svg { width: 100%; height: 100%; border-radius: 12px; }
  .sentence-text {
    font-size: 28px;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.9;
    word-break: keep-all;
  }
  .sentence-text .word-chunk {
    display: inline-block;
    margin: 0 4px;
    padding: 2px 4px;
    border-radius: 6px;
  }
  .sentence-text .word-chunk.highlight {
    background: var(--gold);
  }

  .read-controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .icon-btn {
    background: var(--panel-light);
    color: var(--white);
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 4px 0 #3a2818;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: none; }

  .read-count-note {
    font-size: 13px;
    color: var(--panel-light);
    font-weight: 700;
    margin-top: 6px;
  }

  /* ---------- RESULT ---------- */
  #resultScreen { align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .result-badge {
    font-size: 80px;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.15));
  }
  .result-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--panel);
  }
  .result-stats {
    background: rgba(255,255,255,0.6);
    border-radius: 14px;
    padding: 14px 24px;
    font-weight: 800;
    color: var(--panel);
    font-size: 16px;
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  .pop-in { animation: pop 0.28s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .shake { animation: shake 0.3s ease; }

  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 10px;
    z-index: 999;
    animation: confettiFall linear forwards;
  }
</style>
</head>
<body>

<div id="app">

  <!-- HOME SCREEN -->
  <div class="screen active" id="home">
    <button class="parent-settings-btn" id="openParentSettings" aria-label="おうちのひと用設定">⚙️</button>
    <div class="title-block">
      <h1>ことばクエスト</h1>
      <p>たんごを あつめて ぼうけんしよう！</p>
    </div>
    <div class="avatar-row">
      <div class="gem"><span class="icon">💎</span><span id="gemCount">0</span></div>
      <div class="gem"><span class="icon">⭐</span><span id="starCount">0</span></div>
    </div>

    <div class="category-strip">
      <h4>ジャンルをえらぶ</h4>
      <div class="cat-scroll" id="catScroll"></div>
    </div>

    <div class="mode-grid">
      <button class="mode-card blocks" data-mode="blocks">
        <div class="mode-icon">🧱</div>
        <div class="mode-text">
          <h3>たんごブロック</h3>
          <p>ブロックをつんで ことばを つくろう</p>
        </div>
      </button>
      <button class="mode-card match" data-mode="match">
        <div class="mode-icon">⚡</div>
        <div class="mode-text">
          <h3>ぴかっとカード</h3>
          <p>でてきた ことばに あう えを タップ！</p>
        </div>
      </button>
      <button class="mode-card journey" data-mode="journey">
        <div class="mode-icon">🗺️</div>
        <div class="mode-text">
          <h3>たびのちず</h3>
          <p>ぶんしょうを よんで すすもう</p>
        </div>
      </button>
    </div>
  </div>

  <!-- PARENT SETTINGS SCREEN -->
  <div class="screen" id="parentSettings">
    <div class="game-header">
      <button class="back-btn" id="closeParentSettings">←</button>
      <div class="parent-title">たんご いちらん</div>
      <div class="parent-count"><span id="wordTotalCount">33</span>こ</div>
    </div>
    <p class="parent-sub">あいうえお じゅん・とうろくずみの たんご</p>
    <div class="word-list-grid" id="wordListGrid"></div>
  </div>

  <!-- BLOCKS GAME -->
  <div class="screen" id="blocksGame">
    <div class="game-header">
      <button class="back-btn" data-back>←</button>
      <div class="progress-track"><div class="progress-fill" id="blocksProgress"></div></div>
      <div class="score-badge">💎 <span id="blocksScore">0</span></div>
    </div>
    <div class="prompt-visual" id="blocksEmoji"></div>
    <div class="target-slots" id="blocksSlots"></div>
    <div class="block-tray" id="blocksTray"></div>
    <div class="feedback-banner" id="blocksFeedback"></div>
    <button class="check-btn" id="blocksCheck">たしかめる</button>
  </div>

  <!-- MATCH GAME -->
  <div class="screen" id="matchGame">
    <div class="game-header">
      <button class="back-btn" data-back>←</button>
      <div class="progress-track"><div class="progress-fill" id="matchProgress"></div></div>
      <div class="score-badge">💎 <span id="matchScore">0</span></div>
    </div>
    <div class="word-flash-stage"><div class="word-flash-text" id="matchWord">たぬき</div></div>
    <div class="match-options" id="matchOptions"></div>
  </div>

  <!-- JOURNEY GAME -->
  <div class="screen" id="journeyGame">
    <div class="game-header">
      <button class="back-btn" data-back>←</button>
      <div class="progress-track"><div class="progress-fill" id="journeyProgress"></div></div>
      <div class="score-badge">💎 <span id="journeyScore">0</span></div>
    </div>
    <div class="journey-map" id="journeyMap"></div>
    <div class="sentence-card">
      <div class="sentence-emoji" id="journeyEmoji"></div>
      <div class="sentence-text" id="journeySentence"></div>
    </div>
    <div class="read-controls">
      <button class="icon-btn" id="journeySlowBtn">🐢 ゆっくりよむ</button>
      <button class="icon-btn" id="journeyReadBtn">🔊 よみあげ</button>
    </div>
    <div class="read-count-note" id="journeyReadNote">3かい こえに だして よんでみよう</div>
    <button class="next-btn" id="journeyNext">よめた！ すすむ →</button>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="resultScreen">
    <div class="result-badge" id="resultBadge">🏆</div>
    <div class="result-title" id="resultTitle">クリア！</div>
    <div class="result-stats" id="resultStats">スコア: 0</div>
    <button class="primary-btn" id="resultHome">ホームへもどる</button>
  </div>

</div>

<script>
/* ============ DATA ============ */
// アイコン定義: 各単語に対応するシンプルなSVGイラスト
// スタイル: 太め輪郭線(#2b1d10)、明るい塗り、丸み、120x120 viewBox
const ICONS = {

function iconSvg(key) {
  if (PHOTO_ICONS[key]) {
    return `<img src="${PHOTO_ICONS[key]}" alt="" style="width:100%;height:100%;object-fit:contain;" />`;
  }
  return ICONS[key] || '';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function speak(text, rate) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = rate || 0.85;
  window.speechSynthesis.speak(u);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateHomeStats() {
  document.getElementById('gemCount').textContent = state.gems;
  document.getElementById('starCount').textContent = state.stars;
}

function confettiBurst() {
  const colors = ['#ffd23f', '#7cbb3f', '#4fb3d9', '#e85d4a', '#fff8e7'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.4 + Math.random() * 1) + 's';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
}

function renderCategories() {
  const scroll = document.getElementById('catScroll');
  scroll.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'cat-chip' + (state.category === 'all' ? ' active' : '');

  scroll.appendChild(allChip);

  CATEGORIES.forEach(c => {

}

document.querySelectorAll('.mode-card').forEach(card => {

});

function categoryLabel(catId) {

  return found ? found.name : catId;
}

function renderWordList() {
  const grid = document.getElementById('wordListGrid');
  grid.innerHTML = '';

  // あいうえお順（日本語ロケールでソート）
  const sorted = [...WORDS].sort((a, b) => a.w.localeCompare(b.w, 'ja'));

  document.getElementById('wordTotalCount').textContent = sorted.length;

  sorted.forEach(word => {

    cat.className = 'wcat';
    cat.textContent = categoryLabel(word.cat);
    card.appendChild(thumb);
    card.appendChild(label);
    card.appendChild(cat);
    grid.appendChild(card);
  });
}

/* ============ BLOCKS GAME ============ */
let blocksState = { words: [], idx: 0, score: 0, chars: [], slots: [], usedIdx: new Set() };

function startBlocksGame() {
  const pool = shuffle(filteredWords(state.category)).slice(0, 8);
  blocksState = { words: pool, idx: 0, score: 0, chars: [], slots: [], usedIdx: new Set() };
  document.getElementById('blocksScore').textContent = 0;
  showScreen('blocksGame');
  loadBlocksRound();
}

function loadBlocksRound() {
  const round = blocksState.words[blocksState.idx];
  document.getElementById('blocksEmoji').innerHTML = iconSvg(round.e);
  document.getElementById('blocksFeedback').className = 'feedback-banner';
  document.getElementById('blocksCheck').disabled = false;

  const chars = round.w.split('');
  blocksState.chars = chars;
  blocksState.slots = new Array(chars.length).fill(null);
  blocksState.usedIdx = new Set();

  // slots
  const slotsEl = document.getElementById('blocksSlots');
  slotsEl.innerHTML = '';
  chars.forEach((c, i) => {
    const s = document.createElement('div');
    s.className = 'slot';
    s.dataset.i = i;
    s.addEventListener('click', () => {
      if (blocksState.slots[i] !== null) {
        // remove from slot back to tray
        const trayIdx = blocksState.slots[i];
        blocksState.usedIdx.delete(trayIdx);
        blocksState.slots[i] = null;
        renderBlocksSlots();
        renderBlocksTray();
      }
    });
    slotsEl.appendChild(s);
  });

  // tray (shuffled letters, may include duplicates handled by index)
  const trayLetters = shuffle(chars.map((c, i) => ({ c, i })));
  const trayEl = document.getElementById('blocksTray');
  trayEl.innerHTML = '';
  trayLetters.forEach(item => {
    const b = document.createElement('button');
    b.className = 'letter-block pop-in';
    b.textContent = item.c;
    b.dataset.trayIdx = item.i;
    b.addEventListener('click', () => {
      if (blocksState.usedIdx.has(item.i)) return;
      const emptySlot = blocksState.slots.findIndex(s => s === null);
      if (emptySlot === -1) return;
      blocksState.slots[emptySlot] = item.i;
      blocksState.usedIdx.add(item.i);
      renderBlocksSlots();
      renderBlocksTray();
    });
    trayEl.appendChild(b);
  });

  renderBlocksSlots();
  renderBlocksTray();
  updateBlocksProgress();
}

function renderBlocksSlots() {
  const slotsEl = document.getElementById('blocksSlots').children;
  blocksState.slots.forEach((trayIdx, i) => {
    const el = slotsEl[i];
    if (trayIdx !== null) {
      el.textContent = blocksState.chars[trayIdx];
      el.classList.add('filled');
    } else {
      el.textContent = '';
      el.classList.remove('filled');
    }
  });
}

function renderBlocksTray() {
  const trayEl = document.getElementById('blocksTray').children;
  Array.from(trayEl).forEach(b => {
    const idx = parseInt(b.dataset.trayIdx);
    b.classList.toggle('used', blocksState.usedIdx.has(idx));
  });
}

function updateBlocksProgress() {
  const pct = (blocksState.idx / blocksState.words.length) * 100;
  document.getElementById('blocksProgress').style.width = pct + '%';
}

document.getElementById('blocksCheck').addEventListener('click', () => {
  if (blocksState.slots.includes(null)) return;
  const built = blocksState.slots.map(i => blocksState.chars[i]).join('');
  const target = blocksState.words[blocksState.idx].w;
  const fb = document.getElementById('blocksFeedback');
  const checkBtn = document.getElementById('blocksCheck');

  if (built === target) {
    fb.textContent = '✅ せいかい！ よくできました！';
    fb.className = 'feedback-banner show ok';
    blocksState.score += 10;
    document.getElementById('blocksScore').textContent = blocksState.score;
    state.gems += 2;
    speak(target, 0.8);
    checkBtn.disabled = true;
    setTimeout(() => {
      blocksState.idx++;
      if (blocksState.idx >= blocksState.words.length) {
        finishGame('blocks', blocksState.score, blocksState.words.length);
      } else {
        loadBlocksRound();
      }
    }, 1100);
  } else {
    fb.textContent = 'おしい！ もういちど！';
    fb.className = 'feedback-banner show bad';
    document.querySelector('.target-slots').classList.add('shake');
    setTimeout(() => document.querySelector('.target-slots').classList.remove('shake'), 300);
  }
});

/* ============ MATCH GAME ============ */
let matchState = { words: [], idx: 0, score: 0, locked: false };

function startMatchGame() {
  const pool = shuffle(filteredWords(state.category)).slice(0, 10);
  matchState = { words: pool, idx: 0, score: 0, locked: false };
  document.getElementById('matchScore').textContent = 0;
  showScreen('matchGame');
  loadMatchRound();
}

function loadMatchRound() {
  matchState.locked = false;
  const round = matchState.words[matchState.idx];
  const wordEl = document.getElementById('matchWord');
  wordEl.textContent = round.w;
  wordEl.classList.remove('pop-in');
  void wordEl.offsetWidth;
  wordEl.classList.add('pop-in');

  // build 4 options: 1 correct + 3 distractors
  const others = filteredWords(state.category).filter(w => w.w !== round.w);
  const distractors = shuffle(others).slice(0, 3);
  const options = shuffle([round, ...distractors]);

  const optsEl = document.getElementById('matchOptions');
  optsEl.innerHTML = '';
  options.forEach(opt => {
    const card = document.createElement('button');
    card.className = 'match-card pop-in';
    card.innerHTML = `<div class="emoji">${iconSvg(opt.e)}</div><div class="label">${opt.w}</div>`;
    card.addEventListener('click', () => {
      if (matchState.locked) return;
      matchState.locked = true;
      if (opt.w === round.w) {
        card.classList.add('correct-flash');
        matchState.score += 10;
        state.gems += 2;
        document.getElementById('matchScore').textContent = matchState.score;
        speak(round.w, 0.85);
      } else {
        card.classList.add('wrong-flash');
        // highlight correct one
        Array.from(optsEl.children).forEach(c => {
          if (c.querySelector('.label').textContent === round.w) c.classList.add('correct-flash');
        });
      }
      setTimeout(() => {
        matchState.idx++;
        if (matchState.idx >= matchState.words.length) {
          finishGame('match', matchState.score, matchState.words.length);
        } else {
          loadMatchRound();
        }
      }, 850);
    });
    optsEl.appendChild(card);
  });

  const pct = (matchState.idx / matchState.words.length) * 100;
  document.getElementById('matchProgress').style.width = pct + '%';
}

/* ============ JOURNEY GAME ============ */
let journeyState = { sentences: [], idx: 0, score: 0, readCount: 0 };

function startJourneyGame() {
  const pool = shuffle(filteredSentences(state.category)).slice(0, 6);
  journeyState = { sentences: pool, idx: 0, score: 0, readCount: 0 };
  document.getElementById('journeyScore').textContent = 0;
  showScreen('journeyGame');
  renderJourneyMap();
  loadJourneyRound();
}

function renderJourneyMap() {
  const mapEl = document.getElementById('journeyMap');
  mapEl.innerHTML = '';
  journeyState.sentences.forEach((s, i) => {
    const step = document.createElement('div');
    step.className = 'map-step';
    if (i < journeyState.idx) { step.classList.add('done'); step.textContent = '✓'; }
    else if (i === journeyState.idx) { step.classList.add('current'); step.textContent = '●'; }
    mapEl.appendChild(step);
  });
}

function loadJourneyRound() {
  journeyState.readCount = 0;
  const round = journeyState.sentences[journeyState.idx];
  document.getElementById('journeyEmoji').innerHTML = iconSvg(round.emoji);
  const sEl = document.getElementById('journeySentence');
  sEl.innerHTML = round.text.map(w => `<span class="word-chunk">${w}</span>`).join('');
  document.getElementById('journeyReadNote').textContent = '3かい こえに だして よんでみよう (0/3)';
  renderJourneyMap();
  const pct = (journeyState.idx / journeyState.sentences.length) * 100;
  document.getElementById('journeyProgress').style.width = pct + '%';
}

document.getElementById('journeyReadBtn').addEventListener('click', () => {
  const round = journeyState.sentences[journeyState.idx];
  speak(round.text.join(''), 0.85);
});
document.getElementById('journeySlowBtn').addEventListener('click', () => {
  const round = journeyState.sentences[journeyState.idx];
  const chunks = round.text;
  const sEl = document.getElementById('journeySentence');
  let i = 0;
  function highlightNext() {
    const spans = sEl.querySelectorAll('.word-chunk');
    spans.forEach(s => s.classList.remove('highlight'));
    if (i >= chunks.length) return;
    spans[i].classList.add('highlight');
    speak(chunks[i], 0.7);
    i++;
    setTimeout(highlightNext, 900);
  }
  highlightNext();
});

document.getElementById('journeyNext').addEventListener('click', () => {
  journeyState.readCount++;
  const note = document.getElementById('journeyReadNote');
  if (journeyState.readCount < 3) {
    note.textContent = `3かい こえに だして よんでみよう (${journeyState.readCount}/3)`;
    return;
  }
  journeyState.score += 15;
  state.gems += 3;
  document.getElementById('journeyScore').textContent = journeyState.score;
  journeyState.idx++;
  if (journeyState.idx >= journeyState.sentences.length) {
    finishGame('journey', journeyState.score, journeyState.sentences.length);
  } else {
    loadJourneyRound();
  }
});

/* ============ FINISH ============ */
function finishGame(mode, score, count) {
  saveProgress();
  state.stars += 1;
  saveProgress();
  const titles = {
    blocks: 'たんごブロック クリア！',
    match: 'ぴかっとカード クリア！',
    journey: 'たびのちず とうちゃく！',
  };
  document.getElementById('resultTitle').textContent = titles[mode];
  document.getElementById('resultStats').textContent = `スコア: ${score}   💎 +${state.gems > 0 ? '' : ''}`;
  document.getElementById('resultStats').innerHTML = `スコア: <strong>${score}</strong>　⭐ もらった: <strong>1</strong>`;
  confettiBurst();
  showScreen('resultScreen');
}

/* ============ INIT ============ */
renderCategories();
updateHomeStats();
</script>
