<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>こうさくカードずかん</title>
<style>
:root{--bg:#0b0f1a;--panel:#161d30;--line:#2b3654;--gold:#ffc93c;--ink:#fff;--sub:#8fa0c4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:radial-gradient(circle at 50% 0%,#1d2946 0%,var(--bg) 60%);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Rounded Mplus 1c",-apple-system,"Segoe UI",sans-serif;
  font-weight:800;overflow:hidden;user-select:none;}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
.screen{flex:1;display:none;flex-direction:column;overflow:hidden;}
.screen.on{display:flex;}

.logo{text-align:center;padding:20px 12px 4px;}
.logo b{display:block;font-size:29px;letter-spacing:2px;
  background:linear-gradient(180deg,#fff 30%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.count{color:var(--sub);font-size:15px;margin-top:6px;}
.count em{color:var(--gold);font-style:normal;font-size:24px;}
.menu{flex:1;display:flex;flex-direction:column;gap:14px;padding:10px 18px 20px;justify-content:center;}
.big{border:none;border-radius:26px;padding:20px;display:flex;align-items:center;gap:16px;
  font:inherit;font-size:27px;color:#0b0f1a;box-shadow:0 7px 0 rgba(0,0,0,.45);
  transition:transform .08s,box-shadow .08s;}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.45);}
.big .ico{font-size:44px;line-height:1;}
.big.make{background:linear-gradient(160deg,#ffd75e,#ff9800);}
.big.book{background:linear-gradient(160deg,#7ee0ff,#2196f3);color:#04203a;}
.big.fight{background:linear-gradient(160deg,#ff8a8a,#e53935);color:#3a0404;}

.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line);}
.back{border:none;background:var(--panel);color:#fff;font:inherit;font-size:19px;
  border-radius:16px;padding:11px 16px;border:2px solid var(--line);white-space:nowrap;}
.bar h2{margin:0;font-size:18px;flex:1;text-align:center;color:var(--gold);}

.step{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:16px;overflow-y:auto;}
.step.on{display:flex;}
.step.tall{justify-content:flex-start;padding-top:14px;}
.ask{font-size:22px;text-align:center;line-height:1.5;}
.ask small{display:block;color:var(--sub);font-size:13px;font-weight:700;margin-top:6px;}
.shoot{width:min(66vw,240px);aspect-ratio:1;border-radius:40px;
  background:linear-gradient(160deg,#ffd75e,#ff8f00);color:#3a2500;border:none;font:inherit;font-size:23px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 10px 0 #a35d00;line-height:1.3;}
.shoot:active{transform:translateY(6px);box-shadow:0 4px 0 #a35d00;}
.shoot span{font-size:64px;}
input[type=file]{display:none;}

.elems{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(96vw,440px);}
.elem{border:4px solid transparent;border-radius:18px;padding:11px 2px;font:inherit;font-size:15px;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 2px 6px rgba(0,0,0,.65);}
.elem span{font-size:32px;line-height:1.1;}
.elem.sel{border-color:#fff;transform:scale(1.06);}

.opts{display:flex;flex-direction:column;gap:11px;width:min(94vw,440px);}
.opt{display:flex;align-items:center;gap:12px;border:4px solid var(--line);border-radius:20px;
  background:#101a2e;color:#fff;font:inherit;font-size:23px;padding:15px 14px;text-align:left;}
.opt .no{flex:0 0 44px;height:44px;border-radius:50%;background:var(--line);color:#cfe0ff;
  display:flex;align-items:center;justify-content:center;font-size:22px;}
.opt.sel{border-color:var(--gold);background:#2a2410;}
.opt.sel .no{background:var(--gold);color:#3a2500;}
.opt.reading{border-color:#7ee0ff;background:#0d2233;}
.rowbtn{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

.txt{width:min(94vw,440px);font:inherit;font-size:22px;text-align:center;padding:14px;
  border-radius:18px;border:3px solid var(--line);background:#0d1424;color:#fff;}
.go{border:none;border-radius:24px;padding:16px 38px;font:inherit;font-size:24px;
  background:linear-gradient(160deg,#8bff9b,#00c853);color:#04270f;box-shadow:0 7px 0 #00722f;}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 #00722f;}
.go.grey{background:#2b3654;color:#8fa0c4;box-shadow:0 7px 0 #1a2237;}
.skip{background:none;border:none;color:var(--sub);font:inherit;font-size:15px;text-decoration:underline;}
.mini-btn{border:none;border-radius:18px;padding:13px 20px;font:inherit;font-size:18px;
  background:var(--panel);color:#fff;border:2px solid var(--line);}
.mini-btn.warn{background:#3a1520;border-color:#7a2740;color:#ff9aa8;}

.meter{width:min(92vw,420px);height:54px;border-radius:27px;background:#0d1424;border:4px solid var(--line);overflow:hidden;}
.meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#ffea00,#ff3d00);}
.pw{font-size:50px;color:var(--gold);letter-spacing:2px;}

.cutbox{width:min(72vw,270px);aspect-ratio:1;border-radius:22px;position:relative;overflow:hidden;
  background:linear-gradient(45deg,#243050 25%,transparent 25%,transparent 75%,#243050 75%),
    linear-gradient(45deg,#243050 25%,#1a2338 25%,#1a2338 75%,#243050 75%);
  background-size:22px 22px;background-position:0 0,11px 11px;border:3px solid var(--line);}
.cutbox img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;}
.slider{width:min(88vw,380px);}
input[type=range]{width:100%;height:36px;accent-color:var(--gold);}

.card{width:min(72vw,280px);border-radius:22px;padding:12px;
  background:linear-gradient(150deg,#f5f7ff,#c8d2ee 45%,#fff 60%,#aebbe0);
  box-shadow:0 0 0 4px #6b7ba8,0 14px 30px rgba(0,0,0,.6);color:#0b0f1a;flex-shrink:0;}
.stagegrad{width:100%;aspect-ratio:1;border-radius:14px;position:relative;overflow:hidden;}
.stagegrad::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),transparent 62%);}
.hero{position:absolute;left:10%;top:6%;width:80%;height:78%;object-fit:contain;z-index:2;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));animation:float 3.2s ease-in-out infinite;}
.shadow{position:absolute;left:26%;bottom:7%;width:48%;height:9%;border-radius:50%;
  background:rgba(0,0,0,.4);filter:blur(6px);z-index:1;animation:shrink 3.2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2.5deg);}50%{transform:translateY(-13px) rotate(2.5deg);}}
@keyframes shrink{0%,100%{transform:scale(1);opacity:.45;}50%{transform:scale(.78);opacity:.25;}}
.card .badge{position:absolute;top:8px;left:8px;width:42px;height:42px;border-radius:50%;z-index:3;
  display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5);}
.card .nm{font-size:22px;text-align:center;margin:10px 0 2px;line-height:1.2;}
.card .tk{font-size:15px;text-align:center;color:#c62828;min-height:20px;}
.card .pv{margin-top:8px;border-radius:12px;padding:6px;text-align:center;font-size:25px;color:#fff;letter-spacing:1px;}

.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);
  grid-auto-rows:1fr;gap:12px;padding:14px 14px 8px;align-content:start;}
.zPager{display:flex;align-items:center;justify-content:center;gap:14px;
  padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));flex-shrink:0;}
.zPager.hidden{display:none;}
.pBtn{width:60px;height:48px;border:3px solid var(--line);border-radius:16px;
  background:#101a2e;color:var(--gold);font-size:22px;font-family:inherit;}
.pBtn:disabled{opacity:.3;color:var(--sub);}
.pDots{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pDots i{width:10px;height:10px;border-radius:50%;background:#2b3654;display:block;}
.pDots i.on{background:var(--gold);transform:scale(1.35);}
.pNum{font-size:17px;font-weight:800;color:var(--gold);}
.mini{border-radius:18px;overflow:hidden;background:#f2f5ff;border:none;padding:0;
  box-shadow:0 4px 0 rgba(0,0,0,.4);position:relative;}
.minipic{width:100%;aspect-ratio:1;position:relative;overflow:hidden;}
.minipic img{position:absolute;left:10%;top:8%;width:80%;height:76%;object-fit:contain;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.4));animation:float 3.4s ease-in-out infinite;}
.mini b{display:block;color:#0b0f1a;font-size:18px;padding:7px 5px 2px;line-height:1.25;}
.mEl{display:block;color:#5c6b8c;font-size:12px;padding:0 4px 5px;}
.mPw{display:block;color:#fff;font-size:14px;font-weight:800;padding:5px 4px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);}
.mini .dot{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;z-index:3;
  display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid #fff;}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);font-size:18px;padding:60px 20px;line-height:1.8;}

.ov{position:fixed;inset:0;background:rgba(4,7,15,.94);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:18px;z-index:50;overflow-y:auto;}
.ov.on{display:flex;}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

.picked{display:flex;gap:8px;justify-content:center;padding:10px;min-height:96px;
  align-items:center;border-bottom:2px solid var(--line);}
.slot{width:74px;height:74px;border-radius:16px;border:3px dashed var(--line);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--line);overflow:hidden;}
.slot img{width:100%;height:100%;object-fit:contain;}
.pickwrap{flex:1;overflow-y:auto;padding:12px;}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  position:relative;overflow:hidden;}
.btop{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:6px 0;overflow:hidden;}
.bbot{flex-shrink:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:8px 0 10px;border-top:2px solid var(--line);background:rgba(8,12,22,.85);}
.whoBtn{background:linear-gradient(160deg,#7ee0ff,#0288d1);color:#04203a;}
.whoBtn2{background:linear-gradient(160deg,#ffb59a,#e64a19);color:#3a1204;}
.mon{font-size:80px;filter:drop-shadow(0 0 20px #ff1744);animation:float 2.6s ease-in-out infinite;}
.mon.hit{animation:shake .3s 3;}
.fire{border:none;border-radius:28px;padding:20px 36px;font:inherit;font-size:29px;
  background:linear-gradient(160deg,#ff6f00,#d50000);color:#fff;
  box-shadow:0 8px 0 #7f0000,0 0 40px rgba(255,61,0,.5);}
.fire:active{transform:translateY(5px);box-shadow:0 3px 0 #7f0000;}
.flier{position:absolute;width:130px;height:130px;object-fit:contain;z-index:9;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));}
@keyframes rushL{0%{left:-40%;top:55%;transform:rotate(-40deg) scale(.6);opacity:0}
  25%{opacity:1}60%{left:33%;top:30%;transform:rotate(15deg) scale(1.25)}
  100%{left:33%;top:30%;transform:rotate(0) scale(1);opacity:0}}
@keyframes rushR{0%{right:-40%;top:55%;transform:rotate(40deg) scale(.6);opacity:0}
  25%{opacity:1}60%{right:33%;top:30%;transform:rotate(-15deg) scale(1.25)}
  100%{right:33%;top:30%;transform:rotate(0) scale(1);opacity:0}}
.boom{font-size:120px;}
.win{font-size:32px;color:var(--gold);text-align:center;line-height:1.4;}
.enemyBox{display:flex;flex-direction:column;align-items:center;gap:5px;}
.ename{font-size:19px;color:#ff8a80;text-shadow:0 2px 6px rgba(0,0,0,.6);}
.hpbar{width:min(66vw,270px);height:22px;border-radius:11px;background:#0d1424;
  border:3px solid var(--line);overflow:hidden;}
.hpbar i{display:block;height:100%;width:100%;
  background:linear-gradient(90deg,#ff5252,#ffab00);transition:width .5s;}
.logline{font-size:20px;color:#fff;text-align:center;min-height:58px;line-height:1.4;
  display:flex;align-items:center;justify-content:center;padding:0 14px;}
.heroRow{display:flex;gap:14px;justify-content:center;align-items:flex-end;}
.heroChip{width:58px;text-align:center;}
.heroChip img{width:58px;height:58px;object-fit:contain;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));animation:float 3s ease-in-out infinite;}
.heroChip b{display:block;font-size:10px;color:var(--sub);line-height:1.2;}
.genki{width:min(58vw,230px);height:14px;border-radius:7px;background:#0d1424;
  border:2px solid var(--line);overflow:hidden;}
.genki i{display:block;height:100%;width:100%;
  background:linear-gradient(90deg,#69f0ae,#00e676);transition:width .4s;}
.acts{display:flex;flex-direction:column;gap:9px;width:min(94vw,420px);padding-bottom:8px;}
.act{border:none;border-radius:20px;padding:15px;font:inherit;font-size:22px;color:#fff;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.45);text-align:left;}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45);}
.act:disabled{opacity:.4;}
.act .ai{font-size:32px;line-height:1;}
.act.a1{background:linear-gradient(160deg,#4fc3f7,#0277bd);}
.act.a2{background:linear-gradient(160deg,#ffb74d,#e65100);}
.act.a3{background:linear-gradient(160deg,#ff8a80,#b71c1c);}
.dots{display:flex;gap:5px;margin-left:auto;}
.dots i{width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.4);}
.dots i.on{background:#ffea00;box-shadow:0 0 8px #ffea00;}
.dmg{position:absolute;left:50%;top:26%;font-size:46px;color:#ffea00;z-index:20;
  text-shadow:0 3px 8px #000;pointer-events:none;animation:rise 1.1s forwards;}
@keyframes rise{0%{transform:translate(-50%,0) scale(.5);opacity:0}
  20%{opacity:1;transform:translate(-50%,-12px) scale(1.25)}
  100%{transform:translate(-50%,-95px) scale(1);opacity:0}}
.tapzone{width:min(90vw,400px);height:165px;border-radius:26px;border:none;font:inherit;
  font-size:29px;color:#3a2500;background:linear-gradient(160deg,#ffd54f,#f57c00);
  box-shadow:0 8px 0 #a35d00;line-height:1.3;}
.tapzone:active{transform:translateY(5px);box-shadow:0 3px 0 #a35d00;}
.tapbar{width:min(90vw,400px);height:16px;border-radius:8px;background:#0d1424;
  border:2px solid var(--line);overflow:hidden;}
.tapbar i{display:block;height:100%;width:100%;background:#ffea00;}
.tele{display:flex;align-items:center;gap:7px;font-size:15px;color:#cfe0ff;
  background:rgba(0,0,0,.35);border-radius:14px;padding:6px 12px;border:2px solid var(--line);}
.tele b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:18px;border:2px solid #fff;
  animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.genkiWrap{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);}
.teamRow{display:flex;gap:9px;overflow-x:auto;padding:10px 16px 6px;width:100%;
  -webkit-overflow-scrolling:touch;}
.tcard{flex:0 0 78px;border:4px solid var(--line);border-radius:18px;background:#101a2e;
  padding:6px 4px 4px;position:relative;}
.tcard img{width:100%;height:52px;object-fit:contain;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));animation:float 3s ease-in-out infinite;}
.tcard b{display:block;font-size:11px;color:#fff;line-height:1.2;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tcard .tel{position:absolute;top:-8px;left:-8px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #fff;z-index:2;}
.tcard .star{position:absolute;top:-14px;right:-8px;font-size:26px;z-index:3;
  animation:pulse 1s ease-in-out infinite;}
.tcard.best{border-color:var(--gold);background:#2a2410;
  box-shadow:0 0 18px rgba(255,201,60,.8);}
.tcard:active{transform:translateY(3px);}
.tcard:disabled{opacity:.5;}
.mon.lunge{animation:lunge .7s ease-in;}
@keyframes lunge{0%{transform:translateY(0) scale(1)}
  45%{transform:translateY(120px) scale(1.5)}100%{transform:translateY(0) scale(1)}}
.stage.quake{animation:quake .5s;}
@keyframes quake{0%,100%{transform:translate(0,0)}
  20%{transform:translate(-11px,7px)}40%{transform:translate(10px,-7px)}
  60%{transform:translate(-8px,-5px)}80%{transform:translate(7px,6px)}}
.redflash{position:fixed;inset:0;background:rgba(255,23,68,.55);z-index:40;
  pointer-events:none;animation:fadeout .6s forwards;}
@keyframes fadeout{0%{opacity:1}100%{opacity:0}}
.dmg.red{color:#ff5252;top:58%;}
.dmg.guard{color:#69f0ae;top:58%;font-size:60px;}
.act.a3.ready{animation:pulse 1.1s ease-in-out infinite;
  box-shadow:0 6px 0 rgba(0,0,0,.45),0 0 30px rgba(255,82,82,.85);}
.whoBtn3{background:linear-gradient(160deg,#cfd8dc,#78909c);color:#12202a;}
.big.test{background:linear-gradient(160deg,#c5cae9,#5c6bc0);color:#0b1030;font-size:22px;}
.pinfo{width:min(94vw,420px);background:#101a2e;border:3px solid var(--line);border-radius:18px;
  padding:10px 14px;font-size:15px;color:#cfe0ff;font-weight:700;}
.pinfo div{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.08);}
.pinfo div:last-child{border-bottom:none;}
.pinfo b{color:var(--gold);}
.allList{width:min(94vw,440px);max-height:52vh;overflow-y:auto;display:flex;
  flex-direction:column;gap:8px;}
.allRow img{width:46px;height:46px;object-fit:contain;flex-shrink:0;}
.allRow .an{flex:1;font-size:16px;line-height:1.3;overflow:hidden;}
.allRow .an i{display:block;font-size:11px;color:var(--sub);font-style:normal;}
.allRow .ow{font-size:11px;color:var(--gold);text-align:center;line-height:1.3;flex-shrink:0;}
.big.gift{background:linear-gradient(160deg,#ffd6f0,#ec407a);color:#3a0421;}
.big.gift.urgent{animation:pulse 1.2s ease-in-out infinite;
  box-shadow:0 7px 0 rgba(0,0,0,.45),0 0 26px rgba(236,64,122,.8);}
.whoPick{border:4px solid var(--line);border-radius:22px;background:#101a2e;color:#fff;
  font:inherit;font-size:18px;padding:16px 22px;display:flex;flex-direction:column;
  align-items:center;gap:4px;}
.whoPick span{font-size:40px;}
.sendOpt{width:min(94vw,420px);border:none;border-radius:22px;padding:16px;font:inherit;
  color:#fff;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.45);}
.sendOpt b{display:block;font-size:23px;margin-bottom:5px;}
.sendOpt i{display:block;font-size:13px;font-style:normal;opacity:.9;line-height:1.4;}
.sendOpt.g1{background:linear-gradient(160deg,#f48fb1,#ad1457);}
.sendOpt.g2{background:linear-gradient(160deg,#80cbc4,#00695c);}
.sendOpt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45);}
.tradeRow{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0;}
.tSide{width:92px;text-align:center;}
.tSide img{width:74px;height:74px;object-fit:contain;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));}
.tSide b{display:block;font-size:13px;color:#fff;line-height:1.2;}
.tSide i{display:block;font-size:11px;font-style:normal;color:var(--gold);margin-top:2px;}
.tArrow{font-size:30px;}
.reqBox{border:4px solid var(--gold);border-radius:20px;background:#161d30;padding:12px;}
.reqBox.out{border-color:var(--line);opacity:.85;}
.reqBox .rhead{font-size:15px;color:#cfe0ff;text-align:center;line-height:1.4;}
.rwIcons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(90vw,380px);}
.rwI{font-size:32px;padding:8px 0;border:4px solid var(--line);border-radius:16px;
  background:#101a2e;}

.phand{

  filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:3;
}
@keyframes swipe{
  0%{transform:translate(-120%,-50%) rotate(-8deg);opacity:0;}
  20%{opacity:1;} 80%{opacity:1;}
  100%{transform:translate(40%,-50%) rotate(8deg);opacity:0;}
}

/* ========== 読み上げ（割り込み対応） ========== */
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang.startsWith('ja'))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}

let seqId=0, seqTimer=null;
/* 進行中の読み上げ列をすべて無効化する */
function stopSpeech(){
  seqId++;
  clearTimeout(seqTimer);
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
/* my を渡すと、その列が失効していたら何も喋らない */
function speak(text,my,cb){
  if(!('speechSynthesis' in window)||!text){cb&&cb();return;}
  if(my!==undefined&&my!==seqId)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=.95;u.pitch=1.1;if(voice)u.voice=voice;
  const done=()=>{if(my===undefined||my===seqId)cb&&cb();};
  u.onend=done;u.onerror=done;
  speechSynthesis.speak(u);
}
/* 単発。必ず先行の読み上げを打ち切る */
function sayNow(text){
  stopSpeech();
  const my=seqId;
  setTimeout(()=>speak(text,my),70); // iOS対策：cancel直後のspeakを避ける
}

 'チョップ','エルボー','ヘッドバット','タックル','スピン','ドリル','ハンマー','クロー','ファング','テイル',

/* わざの あたま に つく ことば（つよそうな ひびき） */
const PRE=['ちょう','だい','しん','れっ','ごう','きわみ','ぜんりょく','むげん','でんせつの','さいきょうの',
 'ミラクル','スーパー','ハイパー','メガ','ギガ','テラ','クリムゾン','ブレイジング','ムーンライト','サンダーボルト',
 'クリスタル','シャドウ','セイクリッド','エターナル','ファイナル','ワールド','ドラゴン','フェニックス','タイガー','コスミック'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function makeNames(k){const el=EL(k),o=new Set();
  while(o.size<4)o.add((Math.random()<.6?rnd(el.w):rnd(A))+rnd(B));return[...o];}
/* わざの つくりかた を 4とおりに して、おなじ ものが 出にくいように する */
function makeTechs(k){
  const el=EL(k),o=new Set();
  let guard=0;
  while(o.size<4 && guard++<400){
    const r=Math.random();
    let t;
    if(r<0.34)      t = el.t + rnd(HIT);                    /* ファイヤーキック */
    else if(r<0.58) t = rnd(PRE) + el.t + rnd(HIT);         /* ちょうファイヤーキック */
    else if(r<0.78) t = rnd(A) + rnd(HIT);                  /* ギガキック */
    else if(r<0.92) t = el.t + rnd(HIT) + '・' + rnd(HIT);  /* アクアウェイブ・バースト */
    else            t = rnd(PRE) + rnd(HIT);                /* れっスラッシュ */
    if(t.length<=16) o.add(t);
  }
  while(o.size<4)o.add(el.t+rnd(HIT)+(o.size+1));
  return[...o];}

function testImg(el){
  const cv=document.createElement('canvas');cv.width=cv.height=220;
  const x=cv.getContext('2d');
  x.font='150px serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText(el.e,110,118);
  return cv.toDataURL('image/png');
}
async function makeTestCards(n){
  const base=Date.now();
  for(let i=0;i<n;i++){
    const el=rnd(ELEMS);
    await dbPut({id:base+i,who:'parent',test:true,photo:testImg(el),elem:el.k,
      name:rnd(el.w)+rnd(B),tech:el.t+rnd(HIT),
      power:Math.round(1000+Math.random()*8900)});
  }
  await refreshCount();parentPanel('テストカードを '+n+'まい つくりました');
}
async function killTestCards(){
  const all=await dbAll();
  const t=all.filter(c=>c&&c.test);
  if(!t.length){parentPanel('テストカードは ありません');return;}
  if(!confirm('テストカード '+t.length+'まいを 削除します。\n（子どもが作ったカードは消えません）'))return;
  for(const c of t)await dbDelRaw(c.id);
  await saveMirror();
  await refreshCount();parentPanel(t.length+'まい 削除しました');
}

/* 親が だれの カードでも コピーを おくれる */
function giftAsParent(c){
  stopSpeech();
  const kids=Object.keys(PROFILES).filter(k=>k!==(c.who||'niru'));
  const ov=document.getElementById('ov');
  ov.innerHTML='<div class="ask" style="font-size:19px">'+esc(c.name)+'の コピーを<br>だれに おくる？</div>'+
    '<div class="rowbtn">'+kids.map(k=>
      '<button class="whoPick" data-k="'+k+'"><span>'+PROFILES[k].e+'</span>'+PROFILES[k].n+'</button>').join('')+
    '</div><div class="rowbtn"><button class="mini-btn" id="gx">◀ もどる</button></div>';
  ov.classList.add('on');
  [...ov.querySelectorAll('[data-k]')].forEach(b=>b.onclick=async()=>{
    const payload=JSON.parse(JSON.stringify(c));
    delete payload.id;delete payload.who;delete payload.test;
    await dbPut({id:Date.now(),kind:'req',type:'gift',from:'parent',to:b.dataset.k,payload:payload});
    await refreshCount();
    ov.innerHTML='<div class="boom pop">🎁</div><div class="win">'+PROFILES[b.dataset.k].n+'に<br>おくりました！</div>'+
      '<div class="rowbtn"><button class="mini-btn" id="gd">OK</button></div>';
    document.getElementById('gd').onclick=()=>allCardsPanel();
  });
  document.getElementById('gx').onclick=()=>allCardsPanel();
}

async function openInbox(){
  const reqs=await allReqs();
  const inc=reqs.filter(r=>r.to===who), out=reqs.filter(r=>r.from===who);
  const list=document.getElementById('inboxList');list.innerHTML='';
  if(!inc.length&&!out.length)
    list.innerHTML='<div class="empty">とどいている ものは ないよ</div>';
  for(const r of inc){
    let pack=[];
    if(r.giveIds){for(const id of r.giveIds){const c=await cardById(id);if(c)pack.push(c);}}
    else{const g=r.payload?r.payload:await cardById(r.giveId);if(g)pack.push(g);}
    const want=r.wantId?await cardById(r.wantId):null;
    if(!pack.length||(r.type==='trade'&&!want)){await dbDelRaw(r.id);continue;}
    const give=pack[0];
    const d=document.createElement('div');d.className='reqBox';
    d.innerHTML='<div class="rhead">'+PROFILES[r.from].e+' '+PROFILES[r.from].n+'から '+
      (r.type==='gift'?('🎁 プレゼント'+(pack.length>1?' '+pack.length+'まい':'')):'🔄 こうかんの おねがい')+'</div>'+
      (give.msg?'<div class="rmsg">「'+esc(give.msg)+'」</div>':'')+
      (pack.length>1?
        '<div class="bulkStrip">'+pack.slice(0,8).map(c=>'<img src="'+c.photo+'">').join('')+
        (pack.length>8?'<span class="more">+'+(pack.length-8)+'</span>':'')+'</div>':
      '<div class="tradeRow">'+
        '<div class="tSide"><img src="'+give.photo+'"><b>'+esc(give.name)+'</b><i>もらう</i></div>'+
        (want?'<div class="tArrow">🔄</div><div class="tSide"><img src="'+want.photo+'"><b>'+
          esc(want.name)+'</b><i>あげる</i></div>':'')+
      '</div>')+
      '<div class="rowbtn"><button class="mini-btn warn rNo">❌ ことわる</button>'+
      '<button class="go rYes">⭕ OK！</button></div>';
    d.querySelector('.rYes').onclick=()=>acceptReq(r);
    d.querySelector('.rNo').onclick=()=>declineReq(r);
    list.appendChild(d);
  }
  for(const r of out){
    let pack=[];
    if(r.giveIds){for(const id of r.giveIds){const c=await cardById(id);if(c)pack.push(c);}}
    else{const g=r.payload?r.payload:await cardById(r.giveId);if(g)pack.push(g);}
    if(!pack.length){await dbDelRaw(r.id);continue;}
    const d=document.createElement('div');d.className='reqBox out';
    d.innerHTML='<div class="rhead">'+PROFILES[r.to].e+' '+PROFILES[r.to].n+'に '+
      (r.type==='gift'?('🎁 プレゼント'+(pack.length>1?' '+pack.length+'まい':'')):'🔄 こうかん')+'を おねがいちゅう…</div>'+
      '<div class="bulkStrip">'+pack.slice(0,8).map(c=>'<img src="'+c.photo+'">').join('')+
      (pack.length>8?'<span class="more">+'+(pack.length-8)+'</span>':'')+'</div>'+
      '<div class="rowbtn"><button class="mini-btn rCan">↩️ とりけす</button></div>';
    d.querySelector('.rCan').onclick=async()=>{await dbDelRaw(r.id);await refreshCount();openInbox();};
    list.appendChild(d);
  }
  go('inbox');
  if(inc.length)sayNow(inc.length+'つ とどいているよ');
}
async function acceptReq(r){
  let pack=[];
  if(r.giveIds){for(const id of r.giveIds){const c=await cardById(id);if(c)pack.push(c);}}
  else{const g=r.payload?r.payload:await cardById(r.giveId);if(g)pack.push(g);}
  if(!pack.length){await dbDelRaw(r.id);openInbox();return;}
  const give=pack[0];
  if(r.type==='gift'){
    let i=0;
    for(const src of pack){
      const copy=JSON.parse(JSON.stringify(src));
      copy.id=Date.now()+(i++);copy.who=r.to;delete copy.test;delete copy.deleted;
      await dbPutRaw(copy);
    }
    await saveMirror();
    sayNow((r.from==='parent'?'おうちのひとから プレゼント！ ':'')+
      (pack.length>1?pack.length+'まい もらったよ！ やったー！':
        give.name+'を もらったよ！'+(give.msg?' '+give.msg:' やったー！')));
  }else{
    const want=await cardById(r.wantId);
    if(!want){await dbDelRaw(r.id);openInbox();return;}
    give.who=r.to;want.who=r.from;
    await dbPut(give);await dbPut(want);
    sayNow('こうかん せいりつ！ '+give.name+'が きたよ！');
  }
  await dbDelRaw(r.id);await saveMirror();await refreshCount();
  const ov=document.getElementById('ov');
  ov.innerHTML='<div class="boom pop">🎉</div><div class="win">'+
    (pack.length>1&&r.type==='gift'?pack.length+'まいが':esc(give.name)+'が')+
    '<br>なかまに なった！</div>'+
    '<div class="rowbtn"><button class="mini-btn" onclick="document.getElementById(\'ov\').classList.remove(\'on\');openZukan()">ずかんを みる</button></div>';
  ov.classList.add('on');
}
async function declineReq(r){
  await dbDelRaw(r.id);await refreshCount();
  sayNow('こんどね、と つたえたよ');openInbox();
}

/* ========== ストレージの じっさいの じょうたい を しらべる ========== */
const health={idb:false,ls:false,persisted:false,iframe:false,mirrorChars:0,err:''};
async function testStorage(){
  try{health.iframe=(window.self!==window.top);}catch(e){health.iframe=true;}
  /* localStorage を ほんとうに 書いて 読めるか ためす */
  try{
    localStorage.setItem('zk-test','1');
    health.ls=(localStorage.getItem('zk-test')==='1');
    localStorage.removeItem('zk-test');
  }catch(e){health.ls=false;health.err=String(e).slice(0,60);}
  /* IndexedDB も ほんとうに 書いて 読めるか ためす */
  if(useDB){
    try{
      const ok=await idbPut({id:-1,probe:true});
      health.idb=!!ok;
      if(ok)await idbDel(-1);
    }catch(e){health.idb=false;health.err=String(e).slice(0,80);}
  }else health.idb=false;

/* ========== 保存：localStorage が 主役。IndexedDB は おまけ ==========
   iframe内の Safari では IndexedDB の接続が 勝手に閉じる。
   そこで localStorage を 正本 とし、そこに 書けたら 保存成功 とみなす。 */
let mem=[],useDB=false,db=null,mirrorOK=false,mirrorN=0,mirrorAll=true,lsOK=false;
const isCard=c=>c&&c.photo&&c.kind!=='req';
const LSKEY='zk-mirror';

/* --- localStorage 側（正本） --- */
function lsRead(){
  try{const m=localStorage.getItem(LSKEY);if(!m)return [];
    const a=JSON.parse(m);return Array.isArray(a)?a:[];
  }catch(e){return [];}
}
function lsWrite(arr){
  try{
    let keep=arr.slice().sort((a,b)=>b.id-a.id);
    let s=JSON.stringify(keep);
    while(s.length>1400000&&keep.length>1){
      keep=keep.slice(0,keep.length-1);s=JSON.stringify(keep);}
    localStorage.setItem(LSKEY,s);
    const chk=localStorage.getItem(LSKEY);
    if(!chk||chk.length!==s.length){lsOK=false;return false;}
    lsOK=true;mirrorOK=true;mirrorN=keep.length;mirrorAll=(keep.length>=arr.length);
    return true;
  }catch(e){lsOK=false;mirrorOK=false;showErr('予備保存: '+(e&&e.message||e));return false;}
}

/* --- IndexedDB 側（あれば つかう。落ちても 無視） --- */
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('kousaku-zukan',1);
  r.onupgradeneeded=e=>e.target.result.createObjectStore('cards',{keyPath:'id'});
  r.onsuccess=e=>{db=e.target.result;useDB=true;
    db.onclose=()=>{useDB=false;};              /* 切れたら すぐ あきらめる */
    db.onversionchange=()=>{try{db.close();}catch(x){}useDB=false;};
    res(true);};
  r.onerror=()=>res(false);setTimeout(()=>res(useDB),6000);
}catch(e){res(false);}});}
function idbAll(){return new Promise(res=>{
  try{
    if(!useDB||!db)return res([]);
    const t=db.transaction('cards').objectStore('cards').getAll();
    t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([]);
  }catch(e){useDB=false;res([]);}
});}
function idbPut(c){return new Promise(res=>{
  try{
    if(!useDB||!db)return res(false);
    const t=db.transaction('cards','readwrite').objectStore('cards').put(c);
    t.onsuccess=()=>res(true);t.onerror=()=>res(false);
  }catch(e){useDB=false;res(false);}   /* 例外を にぎりつぶして 先へ進む */
});}
function idbDel(id){return new Promise(res=>{
  try{
    if(!useDB||!db)return res(false);
    const t=db.transaction('cards','readwrite').objectStore('cards').delete(id);
    t.onsuccess=()=>res(true);t.onerror=()=>res(false);
  }catch(e){useDB=false;res(false);}
});}

/* --- 共通API：memory ← localStorage ← IndexedDB を つねに合体 --- */
function mergeInto(target,src){
  const have=new Set(target.map(c=>c&&c.id));
  src.forEach(c=>{if(c&&!have.has(c.id)){target.push(c);have.add(c.id);}});
  return target;
}
async function dbAllRaw(){
  let out=mem.slice();
  mergeInto(out,lsRead());
  if(useDB)mergeInto(out,await idbAll());
  mem=out.slice();
  return out;
}
const dbAll=()=>dbAllRaw();

async function dbPutRaw(c){
  const i=mem.findIndex(x=>x&&x.id===c.id);
  if(i>=0)mem[i]=c;else mem.push(c);
  return true;
}
/* 本保存：localStorage に 書けたら 成功。IndexedDB は 補助 */
async function dbPut(c){
  await dbPutRaw(c);
  const all=await dbAllRaw();
  const ok=lsWrite(all.filter(isCard));
  idbPut(c);                       /* 待たない。失敗しても 気にしない */
  return ok;
}
async function dbDelRaw(id){
  mem=mem.filter(c=>c&&c.id!==id);
  const all=await dbAllRaw();
  lsWrite(all.filter(isCard));
  idbDel(id);
  return true;
}
/* カードは ごみばこ行き。実データは 消さない */
async function dbDel(id){
  const all=await dbAllRaw();
  const c=all.find(x=>x&&x.id===id);
  if(c&&isCard(c)){c.deleted=true;c.delAt=Date.now();await dbPut(c);}
  else await dbDelRaw(id);
}
async function saveMirror(){
  const all=await dbAllRaw();
  return lsWrite(all.filter(isCard));
}
/* IndexedDB に しか ないカードを localStorage に すくいあげる */
async function syncFromMirror(){
  const before=(await dbAllRaw()).length;
  if(useDB){
    const idb=await idbAll();
    mergeInto(mem,idb);
  }
  mergeInto(mem,lsRead());
  const all=mem.slice();
  lsWrite(all.filter(isCard));
  return Math.max(0,all.length-before);
}

function loadPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{

    };img.src=fr.result;};

}
function cutOut(src,tol){
  const W=src.width,H=src.height;
  const ctx=src.getContext('2d',{willReadFrequently:true});
  const im=ctx.getImageData(0,0,W,H),d=im.data;
  let r=0,g=0,b=0,n=0;
  const smp=(x,y)=>{const i=(y*W+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;};
  for(let x=0;x<W;x+=2){smp(x,0);smp(x,H-1);}
  for(let y=0;y<H;y+=2){smp(0,y);smp(W-1,y);}
  r/=n;g/=n;b/=n;
  const t2=tol*tol*3,seen=new Uint8Array(W*H),st=new Int32Array(W*H);let sp=0;
  const push=p=>{if(!seen[p]){const i=p*4,dr=d[i]-r,dg=d[i+1]-g,db=d[i+2]-b;
    if(dr*dr+dg*dg+db*db<t2){seen[p]=1;st[sp++]=p;}}};
  for(let x=0;x<W;x++){push(x);push((H-1)*W+x);}
  for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
  while(sp>0){const p=st[--sp],x=p%W,y=(p-x)/W;
    if(x>0)push(p-1);if(x<W-1)push(p+1);if(y>0)push(p-W);if(y<H-1)push(p+W);}
  for(let p=0;p<W*H;p++)if(seen[p])d[p*4+3]=0;
  const al=new Uint8Array(W*H);
  for(let p=0;p<W*H;p++)al[p]=d[p*4+3];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const p=y*W+x;let s=0;
    for(let j=-1;j<2;j++)for(let i=-1;i<2;i++)s+=al[p+j*W+i];
    d[p*4+3]=s/9;}
  let x0=W,y0=H,x1=0,y1=0,any=false;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(d[(y*W+x)*4+3]>40){any=true;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(!any){x0=0;y0=0;x1=W-1;y1=H-1;}
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;
  tmp.getContext('2d').putImageData(im,0,0);
  const pad=8,cw=Math.min(W,x1-x0+1+pad*2),ch=Math.min(H,y1-y0+1+pad*2);
  const out=document.createElement('canvas');
  const lim=Math.min(1,320/Math.max(cw,ch));   /* 1枚あたり 約40KB に おさえる */
  out.width=Math.round(cw*lim);out.height=Math.round(ch*lim);
  out.getContext('2d').drawImage(tmp,Math.max(0,x0-pad),Math.max(0,y0-pad),cw,ch,
    0,0,out.width,out.height);
  /* 透過を のこしたまま 軽くする */
  let d1=out.toDataURL('image/webp',0.8);
  if(!d1.startsWith('data:image/webp'))d1=out.toDataURL('image/png');
  return d1;
}
function reCut(){if(!srcCanvas)return;
  draft.photo=cutOut(srcCanvas,+document.getElementById('tolR').value);
  document.getElementById('cutPrev').src=draft.photo;}
function keepBG(){

/* ================= ゆびで なおす（けす／もどす） =================
   pFull  : 元の しゃしん（縮小ずみ）— もどす ときの もと
   pWork  : いま 見えている 絵
   pStack : ひとつ もどす ための 記録（さいだい 12かい）           */
let pFull=null,pWork=null,pCtx=null,pMode='e',pDrawing=false,pStack=[],pLast=null;

function openPaint(){
  if(!srcCanvas){sayNow('さきに しゃしんを えらんでね');return;}
  const cv=document.getElementById('pcv');
  /* 画面に おさまる 大きさに そろえる（さいだい 520px） */

  cv.width=w;cv.height=h;
  pCtx=cv.getContext('2d',{willReadFrequently:true});

  const tol=+(document.getElementById('tolR')||{value:52}).value;
  if(draft.photo && !draft.photo.startsWith('data:image/jpeg')) applyAutoCut(tol);
  pStack=[];pushUndo();
  drawBrushHint();
  bindPaint();
  const hand=document.getElementById('pHand');
  if(hand)hand.style.display='block';
  pMode='e';setPMode('e');
  toStep('paint');
  sayNow('ゆびで なぞると きえるよ。まちがえたら もどす を つかってね');
}
/* まわりの いろに にた ところを 透明にする（cutOut と おなじ かんがえ方） */
function applyAutoCut(tol){
  const W=pCtx.canvas.width,H=pCtx.canvas.height;
  const im=pCtx.getImageData(0,0,W,H),d=im.data;
  let r=0,g=0,b=0,n=0;
  const smp=(x,y)=>{const i=(y*W+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;};
  for(let x=0;x<W;x+=2){smp(x,0);smp(x,H-1);}
  for(let y=0;y<H;y+=2){smp(0,y);smp(W-1,y);}
  r/=n;g/=n;b/=n;
  const t2=tol*tol*3,seen=new Uint8Array(W*H),st=new Int32Array(W*H);let sp=0;
  const push=q=>{if(!seen[q]){const i=q*4,dr=d[i]-r,dg=d[i+1]-g,db=d[i+2]-b;
    if(dr*dr+dg*dg+db*db<t2){seen[q]=1;st[sp++]=q;}}};
  for(let x=0;x<W;x++){push(x);push((H-1)*W+x);}
  for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
  while(sp>0){const q=st[--sp],x=q%W,y=(q-x)/W;
    if(x>0)push(q-1);if(x<W-1)push(q+1);if(y>0)push(q-W);if(y<H-1)push(q+W);}
  for(let q=0;q<W*H;q++)if(seen[q])d[q*4+3]=0;
  pCtx.putImageData(im,0,0);
}
function setPMode(m){
  pMode=m;
  document.getElementById('pmErase').classList.toggle('on',m==='e');
  document.getElementById('pmRestore').classList.toggle('on',m==='r');
  sayNow(m==='e'?'けす モード。しゃしんを ゆびで なぞってね'
                :'もどす モード。もどしたい ところを なぞってね');
}
function drawBrushHint(){
  const r=+document.getElementById('pSize').value;
  const d=document.getElementById('pDot');
  d.style.width=d.style.height=Math.max(10,Math.min(44,r))+'px';
}
function pushUndo(){
  try{
    pStack.push(pCtx.getImageData(0,0,pCtx.canvas.width,pCtx.canvas.height));
    if(pStack.length>12)pStack.shift();
  }catch(e){}
}
function pUndo(){
  if(pStack.length<2){sayNow('これいじょうは もどせないよ');return;}
  pStack.pop();
  pCtx.putImageData(pStack[pStack.length-1],0,0);
  sayNow('ひとつ もどしたよ');
}
function pResetAll(){
  const w=pCtx.canvas.width,h=pCtx.canvas.height;
  pCtx.clearRect(0,0,w,h);pCtx.drawImage(pFull,0,0);
  pStack=[];pushUndo();
  sayNow('さいしょの しゃしんに もどしたよ');
}
/* ゆびの ばしょを キャンバスの ざひょうに なおす */
function pPos(e){
  const cv=pCtx.canvas,r=cv.getBoundingClientRect();
  const t=(e.touches&&e.touches.length)?e.touches[0]
        :(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;
  return {x:(t.clientX-r.left)*cv.width/r.width, y:(t.clientY-r.top)*cv.height/r.height};
}
function pStroke(a,b){
  const rad=+document.getElementById('pSize').value;
  const ctx=pCtx;
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=rad;
  if(pMode==='e'){
    ctx.globalCompositeOperation='destination-out';
    ctx.strokeStyle='rgba(0,0,0,1)';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }else{
    /* もどす：もとの しゃしんを その線の かたちだけ 描きもどす */
    const t=document.createElement('canvas');
    t.width=ctx.canvas.width;t.height=ctx.canvas.height;
    const tc=t.getContext('2d');
    tc.lineCap='round';tc.lineJoin='round';tc.lineWidth=rad;
    tc.strokeStyle='#000';
    tc.beginPath();tc.moveTo(a.x,a.y);tc.lineTo(b.x,b.y);tc.stroke();
    tc.globalCompositeOperation='source-in';
    tc.drawImage(pFull,0,0);
    ctx.globalCompositeOperation='source-over';
    ctx.drawImage(t,0,0);
  }
  ctx.restore();
}
/* ゆびの イベントを つなぐ（一度だけ）。Pointer Events が いちばん 確実 */
let pBound=false;
function bindPaint(){
  if(pBound)return;
  const cv=document.getElementById('pcv');
  if(!cv)return;
  cv.style.touchAction='none';
  if(window.PointerEvent){
    cv.addEventListener('pointerdown',e=>{
      try{cv.setPointerCapture(e.pointerId);}catch(x){}
      pStart(e);
    });
    cv.addEventListener('pointermove',pMove);
    cv.addEventListener('pointerup',pEnd);
    cv.addEventListener('pointercancel',pEnd);
  }else{
    cv.addEventListener('touchstart',pStart,{passive:false});
    cv.addEventListener('touchmove',pMove,{passive:false});
    cv.addEventListener('touchend',pEnd);
    cv.addEventListener('touchcancel',pEnd);
    cv.addEventListener('mousedown',pStart);
    cv.addEventListener('mousemove',pMove);
    window.addEventListener('mouseup',pEnd);
  }
  pBound=true;
}
function hideHand(){
  const h=document.getElementById('pHand');
  if(h)h.style.display='none';
}
function pStart(e){
  if(e.cancelable)e.preventDefault();
  if(!pCtx)return;
  hideHand();
  pDrawing=true;pLast=pPos(e);
  pStroke(pLast,{x:pLast.x+0.01,y:pLast.y});
}
function pMove(e){
  if(!pDrawing||!pCtx)return;
  if(e.cancelable)e.preventDefault();
  const p=pPos(e);pStroke(pLast,p);pLast=p;
}
function pEnd(){ if(!pDrawing)return; pDrawing=false; pushUndo(); }
function pCancel(){ toStep('cut'); }
/* できあがりを きりぬき画像として ほぞん（まわりの あまりを 切りつめる） */
function pDone(){
  const cv=pCtx.canvas,W=cv.width,H=cv.height;
  const d=pCtx.getImageData(0,0,W,H).data;
  let x0=W,y0=H,x1=0,y1=0,any=false;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(d[(y*W+x)*4+3]>40){any=true;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(!any){sayNow('ぜんぶ きえちゃった。もどす を おしてね');return;}
  const pad=6,cw=Math.min(W,x1-x0+1+pad*2),ch=Math.min(H,y1-y0+1+pad*2);
  const out=document.createElement('canvas');
  const lim=Math.min(1,320/Math.max(cw,ch));
  out.width=Math.round(cw*lim);out.height=Math.round(ch*lim);
  out.getContext('2d').drawImage(cv,Math.max(0,x0-pad),Math.max(0,y0-pad),cw,ch,
    0,0,out.width,out.height);
  let u=out.toDataURL('image/webp',0.8);
  if(!u.startsWith('data:image/webp'))u=out.toDataURL('image/png');
  draft.photo=u;
  document.getElementById('cutPrev').src=u;
  toStep('cut');
  sayNow('きれいに なったね！');
}

let elemGrp=null;
function buildElems(){
  const box=document.getElementById('elems');box.innerHTML='';
  const groups=[];
  ELEMS.forEach(el=>{ if(!groups.includes(el.grp))groups.push(el.grp); });
  if(!elemGrp){
    const cur=ELEMS.find(x=>x.k===draft.elem);
    elemGrp=cur?cur.grp:groups[0];
  }
  groups.forEach(g=>{
    const open=(g===elemGrp);
    const head=document.createElement('button');
    head.className='egHead'+(open?' open':'');
    const n=ELEMS.filter(x=>x.grp===g);
    head.innerHTML='<span class="egIco">'+n.map(x=>x.e).join('')+'</span>'
      +'<span class="egName">'+g+'</span><span class="egArrow">'+(open?'▾':'▸')+'</span>';
    head.onclick=()=>{ elemGrp=(elemGrp===g?null:g); buildElems(); if(elemGrp)sayNow(g); };
    box.appendChild(head);
    if(!open)return;
    const wrap=document.createElement('div');wrap.className='egGrid';
    n.forEach(el=>{const b=document.createElement('button');
      b.className='elem'+(draft.elem===el.k?' sel':'');b.style.background=el.g;
      b.innerHTML='<span>'+el.e+'</span>'+el.n;
      b.onclick=()=>{draft.elem=el.k;sayNow(el.n);
        [...box.querySelectorAll('.elem')].forEach(c=>c.classList.remove('sel'));
        b.classList.add('sel');
        setGrey('e-next',false);};
      wrap.appendChild(b);});
    box.appendChild(wrap);
  });
  setGrey('e-next',!draft.elem);
}

/* ===== たたかう：ターン制（負けなし） ===== */
const ENEMIES=[
 {e:'👾',n:'バグゴースト'},{e:'🐉',n:'ドラゴンロード'},{e:'👹',n:'オニマスク'},
 {e:'🦖',n:'キングザウルス'},{e:'🤖',n:'メカロボット'},{e:'🐙',n:'オクトパンチ'},
 {e:'🦑',n:'イカロン'},{e:'👻',n:'ゴーストン'},{e:'🦂',n:'サソリガー'},{e:'🕷',n:'スパイダーン'}
];
/* だれが だれに 強いか（15グループ × 5すくみ）
   おなじ グループの なかだけで まわるので、おぼえやすい */
const BEATS={fire:'thun',thun:'water',water:'wind',wind:'rock',rock:'fire',
             light:'dark',dark:'magic',magic:'time',time:'space',space:'light',
             steel:'ice',ice:'sound',sound:'toxic',toxic:'leaf',leaf:'steel',
             cloud:'rain',rain:'rainbow',rainbow:'sun',sun:'moon',moon:'cloud',
             wave:'bubble',bubble:'shell',shell:'fish',fish:'ship',ship:'wave',
             sand:'volcano',volcano:'crystal',crystal:'cave',cave:'mountain',mountain:'sand',
             dragon:'dino',dino:'bird',bird:'bug',bug:'wolf',wolf:'dragon',
             shark:'whale',whale:'octo',octo:'crab',crab:'jelly',jelly:'shark',
             robot:'gear',gear:'battery',battery:'laser',laser:'radar',radar:'robot',
             car:'train',train:'plane',plane:'digger',digger:'bike',bike:'car',
             sword:'shield',shield:'bow',bow:'hammer',hammer:'crown',crown:'sword',
             candy:'cake',cake:'ramen',ramen:'sushi',sushi:'juice',juice:'candy',
             happy:'brave',brave:'calm',calm:'angry',angry:'dream',dream:'happy',
             red:'blue',blue:'yellow',yellow:'green',green:'purple',purple:'red',
             ghost:'slime',slime:'star',star:'mirror',mirror:'key',key:'ghost'};
const counterOf=e=>Object.keys(BEATS).find(k=>BEATS[k]===e);

let bt=null, btTimers=[], btIntervals=[];
function bTime(fn,ms){const id=setTimeout(fn,ms);btTimers.push(id);return id;}
function clearBattle(){btTimers.forEach(clearTimeout);btTimers=[];
  btIntervals.forEach(clearInterval);btIntervals=[];}

function toStage(){
  if(!picks.length)return;
  clearBattle();
  const en=rnd(ENEMIES);
  const avg=picks.reduce((s,c)=>s+c.power,0)/picks.length;
  const hp=Math.round(avg*(5.5+picks.length*0.8));
  bt={en:en,emax:hp,ehp:hp,avg:avg,genki:100,combo:0,busy:true,turn:0,raged:false,next:null,said:false};
  go('stage');
  rollNext();
  renderStage(en.n+'が あらわれた！');
  sayNow(en.n+'が あらわれた！');
  bTime(()=>{bt.busy=false;announceNext();},1900);
}
/* 敵が つぎに つかう ちから を きめる。
   75しゅるい から でたらめに えらぶと、⭐が ほぼ 出なくなる。
   そこで たいていの ターンは「チームの だれかが 勝てる ちから」を えらぶ。 */
function rollNext(){
  const team=(picks||[]).filter(c=>c&&c.elem&&BEATS[c.elem]);
  if(team.length && Math.random()<0.7){
    const c=team[Math.floor(Math.random()*team.length)];
    bt.next=BEATS[c.elem];          /* この c が ⭐ に なる */
    return;
  }
  /* のこりは チームと おなじ なかまうち から（まったくの 無関係を へらす） */
  const grps=[...new Set((picks||[]).map(c=>{const e=EL(c.elem);return e&&e.grp;}).filter(Boolean))];
  const pool=grps.length?ELEMS.filter(e=>grps.includes(e.grp)):ELEMS;
  bt.next=rnd(pool.length?pool:ELEMS).k;
}
function announceNext(){
  const el=EL(bt.next);
  if(bt.combo>=3&&!bt.said){
    bt.said=true;
    renderStage('ひっさつわざが つかえるぞ！');
    sayNow('ひっさつわざが つかえるぞ！ あかい ボタンを おしてみて！');
    bTime(()=>{renderStage('つぎは '+el.n+'の こうげきだ！');
      sayNow('つぎは、'+el.n+'の こうげきだ！');},2600);
    return;
  }
  renderStage('つぎは '+el.n+'の こうげきだ！');
  sayNow('つぎは、'+el.n+'の こうげきだ！ どの なかまで たたかう？');
}

function renderStage(msg){
  if(!bt)return;
  const st=document.getElementById('stage');
  const pct=Math.max(0,bt.ehp/bt.emax*100);
  const gp=Math.max(0,bt.genki);
  const nx=EL(bt.next), want=counterOf(bt.next);
  const dots=[0,1,2].map(i=>'<i class="'+(bt.combo>i?'on':'')+'"></i>').join('');
  st.innerHTML=
   '<div class="btop">'+
     '<div class="enemyBox">'+
       '<div class="ename">'+bt.en.n+'</div>'+
       '<div class="hpbar"><i style="width:'+pct+'%"></i></div>'+
       '<div class="mon" id="mon">'+bt.en.e+'</div>'+
       '<div class="tele">つぎの こうげき <b style="background:'+nx.g+'">'+nx.e+'</b> '+nx.n+'</div>'+
     '</div>'+
     '<div class="logline" id="log">'+msg+'</div>'+
   '</div>'+
   '<div class="bbot">'+
     '<div class="genkiWrap"><span>げんき</span>'+
       '<div class="genki"><i style="width:'+gp+'%;background:'+
         (gp>50?'linear-gradient(90deg,#69f0ae,#00e676)':gp>25?
          'linear-gradient(90deg,#ffe082,#ffab00)':'linear-gradient(90deg,#ff8a80,#d50000)')+
       '"></i></div></div>'+
     '<div class="teamRow" id="teamRow">'+picks.map((c,i)=>{
        const el=EL(c.elem), best=c.elem===want;
        return '<button class="tcard'+(best?' best':'')+'" data-i="'+i+'"'+(bt.busy?' disabled':'')+'>'+
          (best?'<span class="star">⭐</span>':'')+
          '<span class="tel" style="background:'+el.g+'">'+el.e+'</span>'+
          '<img src="'+c.photo+'"><b>'+esc(c.name)+'</b></button>';}).join('')+
     '</div>'+
     '<div class="acts">'+
       '<button class="act a2" id="ac2"'+(bt.busy?' disabled':'')+'>'+
         '<span class="ai">👊</span>れんだ！</button>'+
       '<button class="act a3'+(bt.combo>=3?' ready':'')+'" id="ac3"'+
         ((bt.busy||bt.combo<3)?' disabled':'')+'>'+
         '<span class="ai">'+(bt.combo>=3?'💥':'🔒')+'</span>'+
         (bt.combo>=3?'ぜんいん ひっさつ！':'ひっさつまで あと'+(3-bt.combo)+'かい')+
         '<span class="dots">'+dots+'</span></button>'+
     '</div>'+
   '</div>';
  if(!bt.busy){
    [...document.getElementById('teamRow').children].forEach(b=>{
      b.onclick=()=>doAttack(+b.dataset.i);});
    document.getElementById('ac2').onclick=doRush;
    if(bt.combo>=3)document.getElementById('ac3').onclick=doFinish;
  }
}
function logMsg(t,sp){const l=document.getElementById('log');if(l)l.textContent=t;
  if(sp!==false)sayNow(sp||t);}
function popDmg(n,cls){
  const st=document.getElementById('stage');if(!st)return;
  const d=document.createElement('div');d.className='dmg '+(cls||'');d.textContent=n;
  st.appendChild(d);bTime(()=>d.remove(),1200);
}
function quake(){const st=document.getElementById('stage');if(!st)return;
  st.classList.add('quake');bTime(()=>st.classList.remove('quake'),520);}
function flash(){const f=document.createElement('div');f.className='redflash';
  document.body.appendChild(f);bTime(()=>f.remove(),620);}

function hitEnemy(dmg,msg,guard){
  bt.ehp-=dmg;popDmg(dmg);
  const m=document.getElementById('mon');
  if(m){m.classList.add('hit');bTime(()=>m.classList.remove('hit'),900);}
  const bar=document.querySelector('.hpbar i');
  if(bar)bar.style.width=Math.max(0,bt.ehp/bt.emax*100)+'%';
  logMsg(msg);
  bTime(()=>{
    if(bt.ehp<=0){winBattle();return;}
    if(!bt.raged&&bt.ehp<bt.emax*.5){
      bt.raged=true;logMsg(bt.en.n+'が パワーアップした！');
      bTime(()=>enemyTurn(guard),1700);
    }else enemyTurn(guard);
  },1500);
}

/* なかまを タップして こうげき */
function doAttack(i){
  if(bt.busy)return;bt.busy=true;bt.turn++;
  const c=picks[i], want=counterOf(bt.next);
  let mul=0.8+Math.random()*0.5, tag='', guard=false;
  if(c.elem===want){mul=2.6;tag='こうかは バツグン！ ';guard=true;}
  else if(c.elem===bt.next){mul=0.45;tag='あまり きかない… ';}
  else if(Math.random()<0.2){mul*=1.9;tag='クリティカル！ ';}
  const dmg=Math.max(100,Math.round(c.power*mul));
  bt.combo=Math.min(3,bt.combo+(guard?2:1));
  renderStage('…');
  bTime(()=>hitEnemy(dmg,tag+c.name+'の '+(c.tech||'こうげき')+'！',guard),350);
}

/* れんだ */
function doRush(){
  if(bt.busy)return;bt.busy=true;
  const st=document.getElementById('stage');
  let taps=0,left=3000;
  st.innerHTML='<div class="btop">'+
    '<div class="mon">'+bt.en.e+'</div>'+
    '<div class="logline">たくさん タップ！</div>'+
    '<div class="tapbar"><i id="tb"></i></div>'+
    '<button class="tapzone" id="tz">ここを<br>れんだ！<br><span id="tc">0</span></button></div>';
  sayNow('たくさん タップ！');
  document.getElementById('tz').onclick=()=>{taps++;
    document.getElementById('tc').textContent=taps;};
  const iv=setInterval(()=>{
    left-=100;
    const b=document.getElementById('tb');if(b)b.style.width=Math.max(0,left/3000*100)+'%';
    if(left<=0){clearInterval(iv);
      bt.combo=Math.min(3,bt.combo+1);
      const dmg=Math.max(300,Math.round(taps*bt.avg*0.16));
      renderStage('…');
      bTime(()=>hitEnemy(dmg,taps+'かい タップ！ れんぞく こうげき！'),300);}
  },100);
  btIntervals.push(iv);
}

/* ぜんいん ひっさつ */
function doFinish(){
  if(bt.busy)return;bt.busy=true;bt.combo=0;bt.said=false;
  const dmg=Math.round(picks.reduce((s,c)=>s+c.power,0)*1.5);
  const st=document.getElementById('stage');
  renderStage('…');
  picks.forEach((c,i)=>{
    const f=document.createElement('img');f.className='flier';f.src=c.photo;
    f.style.animation=(i%2?'rushR':'rushL')+' 1.1s ease-in '+(i*0.18)+'s forwards';
    f.style.opacity=0;st.appendChild(f);});
  sayNow('ぜんいん ひっさつわざ！');
  bTime(()=>hitEnemy(dmg,'ぜんいん ひっさつわざ！！','guard'),1500+picks.length*120);
}

/* ===== 敵のターン：しっかり見せる ===== */
function enemyTurn(guard){
  if(!bt)return;
  const el=EL(bt.next);
  logMsg(bt.en.n+'の '+el.n+'こうげき！');
  const m=document.getElementById('mon');
  if(m)m.classList.add('lunge');
  bTime(()=>{
    if(guard){
      popDmg('🛡','guard');quake();
      logMsg('ぼうぎょ せいこう！ ダメージ 0！','ぼうぎょ せいこう！ ダメージ ゼロ！');
    }else{
      const hit=12+Math.floor(Math.random()*10)+(bt.raged?6:0);
      bt.genki-=hit;
      flash();quake();
      popDmg('-'+hit,'red');
      const g=document.querySelector('.genki i');
      if(g){const gp=Math.max(0,bt.genki);g.style.width=gp+'%';
        g.style.background=gp>50?'linear-gradient(90deg,#69f0ae,#00e676)':
          gp>25?'linear-gradient(90deg,#ffe082,#ffab00)':'linear-gradient(90deg,#ff8a80,#d50000)';}
      logMsg(hit+' ダメージを うけた！');
    }
    bTime(()=>{
      if(bt.genki<=0){
        bt.genki=60;
        renderStage('ピンチ！ …でも たちあがった！');
        sayNow('ピンチ！ でも たちあがった！ がんばれ！');
        bTime(()=>{bt.busy=false;rollNext();announceNext();},2000);
      }else{bt.busy=false;rollNext();announceNext();}
    },1500);
  },700);
}

function winBattle(){
  const st=document.getElementById('stage');
  st.innerHTML='<div class="btop"><div class="boom pop">💥</div>'+
    '<div class="win">'+bt.en.n+'を たおした！</div></div>';
  sayNow(bt.en.n+'を たおした！');
  bTime(()=>{
    st.innerHTML='<div class="btop"><div class="boom pop">🏆</div>'+
      '<div class="win">やったー！<br>'+picks.map(c=>esc(c.name)).join('・')+'の<br>しょうり！</div>'+
      '<div class="rowbtn"><button class="mini-btn" onclick="toStage()">もういちど たたかう</button>'+
      '<button class="mini-btn" onclick="openBattle()">なかまを かえる</button>'+
      '<button class="mini-btn" onclick="goHome()">おわる</button></div></div>';
    sayNow('やったー！ しょうり！');bt.busy=true;
  },2200);
}

/* バックアップ（きょうだい全員分をまとめて保存） */
async function backup(){
  const all=(await dbAll()).filter(c=>isCard(c)&&!c.deleted);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(all)],{type:'application/json'}));
  a.download='zukan-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  try{localStorage.setItem('zk-unsaved',0);}catch(e){}
  showBkNote();
}
async function restore(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=async()=>{try{
    const arr=JSON.parse(fr.result);
    const have=new Set((await dbAll()).map(c=>c.id));
    let add=0;
    for(const c of arr){if(isCard(c)&&!have.has(c.id)){delete c.deleted;await dbPutRaw(c);add++;}}
    await saveMirror();
    await refreshCount();
    sayNow(add?add+'まい ふえたよ':'あたらしい カードは なかったよ');
  }catch(e){alert('このファイルは読み込めません');}};
  fr.readAsText(f);inp.value='';
}

 try{

 }catch(e){showErr('起動エラー: '+(e&&e.message||e));}
