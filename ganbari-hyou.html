<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>がんばりスタンプラリー</title>
<style>
  :root {
    --kaiju-bg-deep: #0e4a36;
    --kaiju-bg-mid: #146149;
    --kaiju-glow: #baff29;
    --kaiju-ember: #ff7a3c;
    --kaiju-cream: #fffbe8;
    --kaiju-line: #2f8f63;

    --hero-bg-deep: #1a1533;
    --hero-bg-mid: #2b2154;
    --hero-chrome: #eef1ff;
    --hero-red: #ff3b5c;
    --hero-blue: #29c5ff;
    --hero-gold: #ffd23f;

    --bg: var(--kaiju-bg-deep);
    --bg-mid: var(--kaiju-bg-mid);
    --accent: var(--kaiju-glow);
    --accent2: var(--kaiju-ember);
    --ink: var(--kaiju-cream);
    --line: var(--kaiju-line);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
    transition: background 0.5s ease;
    overscroll-behavior: none;
    overflow-x: hidden;
  }

  body.theme-jinan {
    --bg: var(--hero-bg-deep);
    --bg-mid: var(--hero-bg-mid);
    --accent: var(--hero-red);
    --accent2: var(--hero-blue);
    --ink: var(--hero-chrome);
    --line: #4a3f7a;
  }

  body {
    position: relative;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.28;
    z-index: 0;
    pointer-events: none;
    animation: drift 14s ease-in-out infinite alternate;
  }
  body::before {
    background: var(--accent);
    top: -120px;
    left: -100px;
  }
  body::after {
    background: var(--accent2);
    bottom: -140px;
    right: -100px;
    animation-delay: -6s;
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(30px, 40px) scale(1.15); }
  }

  #app {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 60px;
    min-height: 100vh;
  }

  /* ---------- tabs ---------- */
  .top-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 13px 8px;
    border-radius: 16px;
    border: 2px solid var(--line);
    background: var(--bg-mid);
    color: var(--ink);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer;
    opacity: 0.55;
    transition: all 0.25s cubic-bezier(.3,1.4,.5,1);
  }
  .tab-btn.active {
    opacity: 1;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent) inset, 0 8px 20px -8px var(--accent);
    transform: translateY(-2px) scale(1.03);
  }
  .tab-btn:active { transform: scale(0.96); }

  /* ---------- header ---------- */
  .theme-header {
    text-align: center;
    margin-bottom: 18px;
  }
  .theme-eyebrow {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.9;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .theme-title {
    font-size: 32px;
    font-weight: 900;
    margin: 0 0 6px;
    line-height: 1.25;
    text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent), 0 3px 0 rgba(0,0,0,0.25);
    animation: titlepulse 3.5s ease-in-out infinite;
  }
  @keyframes titlepulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .theme-sub {
    font-size: 13px;
    opacity: 0.8;
    margin: 0 0 14px;
  }

  .progress-count {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    opacity: 0.95;
  }
  .progress-count b {
    font-size: 26px;
    color: var(--accent);
  }

  .progress-track {
    height: 12px;
    border-radius: 8px;
    background: var(--bg-mid);
    border: 1px solid var(--line);
    overflow: hidden;
    margin: 10px auto 0;
    max-width: 340px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    background-size: 200% 100%;
    animation: shimmer 2.2s linear infinite;
    transition: width 0.6s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes shimmer {
    0% { background-position: 0% 0; }
    100% { background-position: -200% 0; }
  }

  /* ---------- stamp picker ---------- */
  .picker-wrap {
    margin: 20px 0 16px;
    text-align: center;
  }
  .picker-label {
    font-size: 14px;
    font-weight: 800;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .picker-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .stamp-choice {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    border: 3px solid var(--line);
    background: var(--bg-mid);
    font-size: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.3,1.6,.5,1), border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .stamp-choice:hover { transform: translateY(-3px) scale(1.06); }
  .stamp-choice:active { transform: scale(0.9); }
  .stamp-choice.selected-flash {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent), 0 10px 20px -8px var(--accent);
  }
  .stamp-choice:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ---------- board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    padding: 16px;
    border-radius: 22px;
    background: var(--bg-mid);
    border: 2px solid var(--line);
    position: relative;
    box-shadow: 0 10px 30px -14px rgba(0,0,0,0.6);
  }

  .cell {
    aspect-ratio: 1;
    border-radius: 16px;
    background: var(--bg);
    border: 2px dashed var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-size: 46px;
    transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }
  .cell .num {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
    opacity: 0.4;
  }
  .cell.milestone {
    border-style: solid;
    border-width: 3px;
  }
  .cell.milestone .num { font-size: 13px; }

  .cell.filled {
    border-style: solid;
    border-color: var(--accent);
    background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 40%, var(--bg)), var(--bg));
    box-shadow: 0 0 14px -2px var(--accent);
    cursor: pointer;
  }
  .cell.filled:active {
    transform: scale(0.9);
  }
  .board-hint {
    text-align: center;
    font-size: 11px;
    opacity: 0.55;
    margin: 10px 0 0;
  }
  .cell.just-filled {
    animation: pop 0.55s cubic-bezier(.3,1.8,.4,1);
  }
  @keyframes pop {
    0% { transform: scale(0.4) rotate(-15deg); }
    55% { transform: scale(1.25) rotate(6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* ---------- confetti ---------- */
  .confetti-piece {
    position: fixed;
    top: 0; left: 0;
    width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 80;
    animation: confetti-fly 0.9s ease-out forwards;
  }
  @keyframes confetti-fly {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: var(--fly); opacity: 0; }
  }

  /* ---------- parent panel ---------- */
  .parent-panel {
    margin-top: 28px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  #toggle-parent {
    width: 100%;
    background: none;
    border: none;
    color: var(--ink);
    opacity: 0.55;
    font-size: 13px;
    padding: 8px 0;
    cursor: pointer;
    text-align: center;
  }
  #parent-controls {
    background: var(--bg-mid);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .btn-row { display: flex; gap: 10px; }
  .p-btn {
    flex: 1;
    padding: 12px 10px;
    border-radius: 12px;
    border: none;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .p-btn:active { transform: scale(0.96); }
  .p-btn.primary { background: var(--accent); color: #16181c; }
  .p-btn.secondary {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink);
  }
  .p-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .field label {
    display: block;
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
  }
  .field input:focus { outline: 2px solid var(--accent); }

  .stat-line {
    font-size: 12px;
    opacity: 0.75;
    display: flex;
    justify-content: space-between;
  }

  /* ---------- celebration overlay ---------- */
  #celebration-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #celebration-overlay[hidden],
  #parent-controls[hidden],
  #confirm-modal[hidden] {
    display: none !important;
  }
  #confirm-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  .confirm-card { padding: 28px 24px; }
  .confirm-message {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.6;
    margin: 0 0 20px;
  }

  .date-field {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .date-field label {
    font-size: 12px;
    opacity: 0.75;
    font-weight: 700;
  }
  .date-field input[type="date"] {
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg-mid);
    color: var(--ink);
    font-size: 14px;
  }
  .celebrate-card {
    background: var(--bg-mid);
    border: 3px solid var(--accent);
    border-radius: 26px;
    padding: 36px 26px;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 0 70px -6px var(--accent);
    animation: cardpop 0.5s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes cardpop {
    0% { transform: scale(0.6) rotate(-4deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .celebrate-card .big-emoji {
    font-size: 58px;
    margin-bottom: 6px;
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .celebrate-card h2 {
    font-size: 23px;
    margin: 4px 0 10px;
  }
  .celebrate-card .reward-text {
    font-size: 19px;
    font-weight: 800;
    color: var(--accent);
    margin: 10px 0 24px;
    line-height: 1.5;
  }
  .celebrate-card .p-btn { width: 100%; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="theme-chonan">
<div id="app">

  <div class="top-tabs">
    <button class="tab-btn" id="tab-chonan" data-child="chonan">🦖 ニル：怪獣クエスト</button>
    <button class="tab-btn" id="tab-jinan" data-child="jinan">🦸 エンゾ：ヒーローチャレンジ</button>
  </div>

  <div class="theme-header">
    <p class="theme-eyebrow" id="eyebrow"></p>
    <h1 class="theme-title" id="title"></h1>
    <p class="theme-sub" id="subtitle"></p>
    <div class="progress-count"><b id="count-num">0</b> / 30 スタンプ</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div class="picker-wrap">
    <div class="date-field">
      <label for="stamp-date">日付</label>
      <input type="date" id="stamp-date">
    </div>
    <p class="picker-label">すきなスタンプをえらんでペタッ！</p>
    <div class="picker-grid" id="picker-grid"></div>
  </div>

  <div class="board" id="board"></div>
  <p class="board-hint">まちがえたスタンプはタップすると消せます</p>

  <div class="parent-panel">
    <button id="toggle-parent">保護者メニュー ▼</button>
    <div id="parent-controls" hidden>
      <div class="btn-row">
        <button class="p-btn secondary" id="undo-stamp">1つ取り消す</button>
        <button class="p-btn secondary" id="reset-board">リセット</button>
      </div>
      <div class="field">
        <label for="reward-input">30個たまったときのごほうび</label>
        <input id="reward-input" type="text" maxlength="40" placeholder="例：おかしを1つえらべる">
      </div>
      <div class="stat-line">
        <span>これまでにクリアした回数</span>
        <span id="rounds-count">0 回</span>
      </div>
    </div>
  </div>

</div>

<div id="celebration-overlay" hidden>
  <div class="celebrate-card">
    <div class="big-emoji" id="celebrate-emoji">🎉</div>
    <h2 id="celebrate-heading">クエストクリア！</h2>
    <div class="reward-text" id="celebrate-reward"></div>
    <button class="p-btn primary" id="claim-btn">つぎのチャレンジへ！</button>
  </div>
</div>

<div id="confirm-modal" hidden>
  <div class="celebrate-card confirm-card">
    <p id="confirm-message" class="confirm-message"></p>
    <div class="btn-row">
      <button class="p-btn secondary" id="confirm-cancel">キャンセル</button>
      <button class="p-btn primary" id="confirm-ok">けす</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "ganbariHyouData_v1";
  const GOAL = 30;

  const STAMP_SETS = {
    chonan: [
      { id: "squid",   emoji: "🦑" },
      { id: "scorpion", emoji: "🦂" },
      { id: "twister", emoji: "🌪️" },
      { id: "boulder", emoji: "🪨" },
      { id: "bone",    emoji: "🦴" },
      { id: "meteor",  emoji: "☄️" },
      { id: "shell",   emoji: "🐚" },
      { id: "mist",    emoji: "🌫️" },
      { id: "web",     emoji: "🕸️" },
      { id: "worm",    emoji: "🪱" },
    ],
    jinan: [
      { id: "bike",     emoji: "🏍️" },
      { id: "herioface", emoji: "🦸" },
      { id: "trident",  emoji: "🔱" },
      { id: "swords",   emoji: "⚔️" },
      { id: "crown",    emoji: "👑" },
      { id: "eagle",    emoji: "🦅" },
      { id: "wolf",     emoji: "🐺" },
      { id: "shield",   emoji: "🛡️" },
      { id: "bolt",     emoji: "⚡" },
      { id: "fire",     emoji: "🔥" },
    ],
  };

  const CONFETTI_COLORS = {
    chonan: ["#baff29", "#ff7a3c", "#fffbe8", "#2f8f63"],
    jinan: ["#ff3b5c", "#29c5ff", "#ffd23f", "#eef1ff"],
  };

  const THEMES = {
    chonan: {
      bodyClass: "theme-chonan",
      eyebrow: "GODZILLA THEME · かいじゅうクエスト",
      title: "ニルの怪獣クエスト",
      subtitle: "がんばったら、すきなスタンプをペタッとはろう！",
      defaultReward: "とっておきのおかしを1つえらべる",
      celebrateHeading: "街を守りきった！クエストクリア！",
      celebrateEmoji: "🌋",
    },
    jinan: {
      bodyClass: "theme-jinan",
      eyebrow: "HERO THEME · ヘンシンチャレンジ",
      title: "エンゾのヒーローチャレンジ",
      subtitle: "がんばったら、すきなスタンプをペタッとはろう！",
      defaultReward: "ヒーローグッズを1つえらべる",
      celebrateHeading: "変身完了！ミッションクリア！",
      celebrateEmoji: "⚡",
    },
  };

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        ["chonan", "jinan"].forEach((key) => {
          if (!parsed[key]) {
            parsed[key] = { stamps: 0, rounds: 0, reward: THEMES[key].defaultReward, types: [], dates: [] };
          }
          if (!Array.isArray(parsed[key].types)) parsed[key].types = [];
          if (!Array.isArray(parsed[key].dates)) parsed[key].dates = [];
          while (parsed[key].dates.length < parsed[key].types.length) parsed[key].dates.push("");
        });
        return parsed;
      }
    } catch (e) {}
    return {
      chonan: { stamps: 0, rounds: 0, reward: THEMES.chonan.defaultReward, types: [], dates: [] },
      jinan: { stamps: 0, rounds: 0, reward: THEMES.jinan.defaultReward, types: [], dates: [] },
    };
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error("保存に失敗しました", e);
    }
  }

  let data = loadData();
  let currentChild = "chonan";
  let lastFilledIndex = -1;

  const boardEl = document.getElementById("board");
  const eyebrowEl = document.getElementById("eyebrow");
  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");
  const countNumEl = document.getElementById("count-num");
  const progressFillEl = document.getElementById("progress-fill");
  const rewardInputEl = document.getElementById("reward-input");
  const roundsCountEl = document.getElementById("rounds-count");
  const pickerGridEl = document.getElementById("picker-grid");
  const dateInputEl = document.getElementById("stamp-date");
  const confirmModal = document.getElementById("confirm-modal");
  const confirmMessageEl = document.getElementById("confirm-message");
  const confirmOkBtn = document.getElementById("confirm-ok");
  const confirmCancelBtn = document.getElementById("confirm-cancel");
  const undoBtn = document.getElementById("undo-stamp");
  const resetBtn = document.getElementById("reset-board");
  const overlayEl = document.getElementById("celebration-overlay");
  const celebrateHeadingEl = document.getElementById("celebrate-heading");
  const celebrateRewardEl = document.getElementById("celebrate-reward");
  const celebrateEmojiEl = document.getElementById("celebrate-emoji");
  const claimBtn = document.getElementById("claim-btn");
  const toggleParentBtn = document.getElementById("toggle-parent");
  const parentControls = document.getElementById("parent-controls");

  function todayStr() {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${mm}-${dd}`;
  }

  function formatDateJp(iso) {
    if (!iso) return "日付なし";
    const parts = iso.split("-");
    if (parts.length !== 3) return iso;
    return `${parts[0]}年${parseInt(parts[1],10)}月${parseInt(parts[2],10)}日`;
  }

  let pendingConfirmAction = null;

  function showConfirm(message, onOk) {
    confirmMessageEl.textContent = message;
    pendingConfirmAction = onOk;
    confirmModal.hidden = false;
  }

  function closeConfirm() {
    confirmModal.hidden = true;
    pendingConfirmAction = null;
  }

  confirmOkBtn.addEventListener("click", () => {
    const action = pendingConfirmAction;
    closeConfirm();
    if (action) action();
  });
  confirmCancelBtn.addEventListener("click", closeConfirm);

  function buildBoard() {
    boardEl.innerHTML = "";
    for (let i = 1; i <= GOAL; i++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (i % 5 === 0 ? " milestone" : "");
      cell.dataset.index = i;
      cell.innerHTML = `<span class="num">${i}</span>`;
      boardEl.appendChild(cell);
    }
  }

  function buildPicker() {
    pickerGridEl.innerHTML = "";
    STAMP_SETS[currentChild].forEach((s) => {
      const btn = document.createElement("button");
      btn.className = "stamp-choice";
      btn.dataset.type = s.id;
      btn.textContent = s.emoji;
      btn.addEventListener("click", (e) => onPickStamp(s, e.currentTarget));
      pickerGridEl.appendChild(btn);
    });
  }

  function spawnConfetti(x, y) {
    const colors = CONFETTI_COLORS[currentChild];
    for (let i = 0; i < 16; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 90;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 30;
      piece.style.setProperty("--fly", `translate(${dx}px, ${dy}px) rotate(${Math.random()*360}deg)`);
      piece.style.left = x + "px";
      piece.style.top = y + "px";
      piece.style.background = colors[i % colors.length];
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 950);
    }
  }

  function render() {
    const theme = THEMES[currentChild];
    const state = data[currentChild];

    document.body.className = theme.bodyClass;
    eyebrowEl.textContent = theme.eyebrow;
    titleEl.textContent = theme.title;
    subtitleEl.textContent = theme.subtitle;
    countNumEl.textContent = state.stamps;
    progressFillEl.style.width = Math.round((state.stamps / GOAL) * 100) + "%";
    roundsCountEl.textContent = state.rounds + " 回";
    rewardInputEl.value = state.reward;

    document.getElementById("tab-chonan").classList.toggle("active", currentChild === "chonan");
    document.getElementById("tab-jinan").classList.toggle("active", currentChild === "jinan");

    const cells = boardEl.querySelectorAll(".cell");
    cells.forEach((cell, idx) => {
      const n = idx + 1;
      const filled = n <= state.stamps;
      cell.classList.toggle("filled", filled);
      cell.classList.remove("just-filled");
      const numSpan = cell.querySelector(".num");
      if (filled) {
        const type = state.types[idx];
        const stampDef = STAMP_SETS[currentChild].find((s) => s.id === type) || STAMP_SETS[currentChild][0];
        cell.textContent = stampDef.emoji;
        cell.title = formatDateJp(state.dates[idx]);
      } else {
        cell.innerHTML = `<span class="num">${n}</span>`;
        cell.removeAttribute("title");
      }
    });

    if (lastFilledIndex > 0) {
      const target = boardEl.querySelector(`.cell[data-index="${lastFilledIndex}"]`);
      if (target) target.classList.add("just-filled");
      lastFilledIndex = -1;
    }

    const isFull = state.stamps >= GOAL;
    pickerGridEl.querySelectorAll(".stamp-choice").forEach((btn) => {
      btn.disabled = isFull;
    });
    undoBtn.disabled = state.stamps <= 0;
  }

  function switchChild(child) {
    currentChild = child;
    buildBoard();
    buildPicker();
    render();
  }

  function onPickStamp(stampDef, btnEl) {
    const state = data[currentChild];
    if (state.stamps >= GOAL) return;

    btnEl.classList.add("selected-flash");
    setTimeout(() => btnEl.classList.remove("selected-flash"), 300);

    state.types.push(stampDef.id);
    state.dates.push(dateInputEl.value || todayStr());
    state.stamps += 1;
    lastFilledIndex = state.stamps;
    saveData();
    render();

    const targetCell = boardEl.querySelector(`.cell[data-index="${state.stamps}"]`);
    if (targetCell) {
      const rect = targetCell.getBoundingClientRect();
      spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }

    if (state.stamps >= GOAL) {
      setTimeout(showCelebration, 500);
    }
  }

  function undoStamp() {
    const state = data[currentChild];
    if (state.stamps <= 0) return;
    state.stamps -= 1;
    state.types.pop();
    state.dates.pop();
    saveData();
    render();
  }

  function removeStampAt(cellIndex) {
    const state = data[currentChild];
    if (cellIndex < 1 || cellIndex > state.stamps) return;
    const dateLabel = formatDateJp(state.dates[cellIndex - 1]);
    showConfirm(`${dateLabel}のスタンプを消しますか？`, () => {
      state.types.splice(cellIndex - 1, 1);
      state.dates.splice(cellIndex - 1, 1);
      state.stamps -= 1;
      saveData();
      render();
    });
  }

  function resetBoard() {
    const state = data[currentChild];
    showConfirm("スタンプを0個に戻します。よろしいですか？（クリア回数は変わりません）", () => {
      state.stamps = 0;
      state.types = [];
      state.dates = [];
      saveData();
      render();
    });
  }

  function showCelebration() {
    const theme = THEMES[currentChild];
    const state = data[currentChild];
    celebrateHeadingEl.textContent = theme.celebrateHeading;
    celebrateEmojiEl.textContent = theme.celebrateEmoji;
    celebrateRewardEl.textContent = state.reward || theme.defaultReward;
    overlayEl.hidden = false;
  }

  function claimReward() {
    const state = data[currentChild];
    state.stamps = 0;
    state.types = [];
    state.dates = [];
    state.rounds += 1;
    saveData();
    overlayEl.hidden = true;
    render();
  }

  document.getElementById("tab-chonan").addEventListener("click", () => switchChild("chonan"));
  document.getElementById("tab-jinan").addEventListener("click", () => switchChild("jinan"));
  undoBtn.addEventListener("click", undoStamp);
  resetBtn.addEventListener("click", resetBoard);
  claimBtn.addEventListener("click", claimReward);

  boardEl.addEventListener("click", (e) => {
    const cell = e.target.closest(".cell.filled");
    if (!cell) return;
    removeStampAt(parseInt(cell.dataset.index, 10));
  });

  toggleParentBtn.addEventListener("click", () => {
    const isHidden = parentControls.hidden;
    parentControls.hidden = !isHidden;
    toggleParentBtn.textContent = isHidden ? "保護者メニュー ▲" : "保護者メニュー ▼";
  });

  rewardInputEl.addEventListener("change", () => {
    data[currentChild].reward = rewardInputEl.value.trim() || THEMES[currentChild].defaultReward;
    saveData();
  });

  buildBoard();
  buildPicker();
  dateInputEl.value = todayStr();
  render();
})();
</script>
</body>
</html>
